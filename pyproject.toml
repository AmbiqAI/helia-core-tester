[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["helia_core_tester*"]

[tool.setuptools.package-data]
"helia_core_tester.mutation" = ["host/*.h", "host/*.c"]
"helia_core_tester.agent_loop" = ["prompt.md.j2"]

[project]
name = "helia_core_tester"
version = "0.9.0"
description = "A comprehensive toolkit for CMSIS-NN testing, test generation, and FVP simulation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Helia-Core Team"}
]

dependencies = [
    # Stays on numpy 1 deliberately: numpy 2 shifts 23 float LSTM/GRU goldens by
    # ~1 ULP, so bumping it needs a golden re-baseline of its own, separate from
    # this Python floor bump.
    "numpy>=1.20.0,<2.0.0",
    "pytest>=7.4.0,<9.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "jinja2>=3.0.0,<4.0.0",
    "typer>=0.9.0,<1.0.0",
    "pylink-square>=1.2.0,<3.0.0",
    # Same pin helia-profiler carries.
    "neuralspotx==0.8.1",
    # CA bundle for downloads (NixOS).
    "certifi>=2023.7.22",
]

[project.scripts]
helia_core_tester = "helia_core_tester.cli:app"

[dependency-groups]
dev = [
    "black",
    "flake8",
    "gcovr",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["helia_core_tester/tests"]

[tool.uv]
package = true
