name: Pytest

# Closes helia-core-tester#57: the #55 fix (closing #54, "56% of float cases
# compare as truncated integers") shipped a pytest regression lock, but
# nothing in this repo's CI ever invoked pytest -- self-validate.yml (#50/
# #61) only generates + compiles against ns-cmsis-nn, it never runs the unit
# suite. So the regression lock only protected the suite when a contributor
# remembered to run pytest locally before pushing.
#
# This is a separate, lighter workflow from self-validate.yml on purpose:
# the pytest suite needs no ARM toolchain and no FVP, so it should report
# and fail fast on its own rather than being bundled with the heavier
# generate+compile matrix. It does check out ns-cmsis-nn: the host C
# harness tests compile against its headers and skip without it.

on:
  # Draft PRs skip the job (see its `if`). `ready_for_review` runs it when a
  # draft is marked ready; `converted_to_draft` replaces a ready PR's result
  # with a skipped run instead of leaving it showing. Neither is a default type.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - main
      - 'dev/**'
  push:
    branches:
      - main
      - 'dev/**'
  workflow_dispatch:
    inputs:
      ns_cmsis_nn_ref:
        description: ns-cmsis-nn ref (branch, tag, or SHA) to test against.
        required: false
        default: dev/kernel-contracts
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-progress runs for superseded pushes on a PR branch.
  # Never cancel a push-to-main run -- each merged commit must report on
  # its own, or a regression on that commit can slip through unreported.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helia-core-tester
        uses: actions/checkout@v4

      - name: Checkout ns-cmsis-nn
        uses: actions/checkout@v4
        with:
          repository: AmbiqAI/ns-cmsis-nn
          # The contract-bound templates refuse to render without the kernel
          # contract export, which on ns-cmsis-nn lives on dev/kernel-contracts
          # (the same ref self-validate.yml uses); with this checkout set as
          # CMSIS_NN_ROOT the test-only fallback contract is bypassed by design.
          ref: ${{ github.event.inputs.ns_cmsis_nn_ref || 'dev/kernel-contracts' }}
          path: ns-cmsis-nn-scratch

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Before setup_ci.sh: its unlocked `uv sync` would quietly rewrite a
      # stale lock instead of failing.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install Python dependencies (no ARM toolchain needed)
        run: ./scripts/setup_ci.sh --skip-build-deps

      # The reference-kernel library (goldens) and the host check compile on
      # the host: fail loudly here if a runner image ever drops its compilers.
      - name: Host compilers
        run: |
          c++ --version
          cc --version

      - name: Run pytest
        env:
          CMSIS_NN_ROOT: ${{ github.workspace }}/ns-cmsis-nn-scratch
        run: uv run pytest helia_core_tester/tests -q -rs
