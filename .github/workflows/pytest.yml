name: Pytest

# Closes helia-core-tester#57: the #55 fix (closing #54, "56% of float cases
# compare as truncated integers") shipped a pytest regression lock, but
# nothing in this repo's CI ever invoked pytest -- self-validate.yml (#50/
# #61) only generates + compiles against ns-cmsis-nn, it never runs the unit
# suite. So the regression lock only protected the suite when a contributor
# remembered to run pytest locally before pushing.
#
# This is a separate, lighter workflow from self-validate.yml on purpose:
# the pytest suite needs no ARM toolchain and no FVP, so it should report
# and fail fast on its own rather than being bundled with the heavier
# generate+compile matrix. It does check out ns-cmsis-nn: the host C
# harness tests compile against its headers and skip without it.

on:
  pull_request:
    branches:
      - main
      - 'dev/**'
  push:
    branches:
      - main
      - 'dev/**'
  workflow_dispatch:
    inputs:
      ns_cmsis_nn_ref:
        description: ns-cmsis-nn ref (branch, tag, or SHA) to test against.
        required: false
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-progress runs for superseded pushes on a PR branch.
  # Never cancel a push-to-main run -- each merged commit must report on
  # its own, or a regression on that commit can slip through unreported.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helia-core-tester
        uses: actions/checkout@v4

      - name: Checkout ns-cmsis-nn
        uses: actions/checkout@v4
        with:
          repository: AmbiqAI/ns-cmsis-nn
          ref: ${{ github.event.inputs.ns_cmsis_nn_ref || 'main' }}
          path: ns-cmsis-nn-scratch

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies (no ARM toolchain needed)
        run: ./scripts/setup_ci.sh --skip-build-deps

      - name: Run pytest
        env:
          CMSIS_NN_ROOT: ${{ github.workspace }}/ns-cmsis-nn-scratch
        run: uv run pytest helia_core_tester/tests -q -rs
