name: Self-Validate Against ns-cmsis-nn

# Closes helia-core-tester#50: this repo previously had no workflow that
# exercised its own generator/build pipeline. A PR here was validated only by
# a title lint, so a broken template, generator bug, or unrenderable
# descriptor landed green and surfaced later in a ns-cmsis-nn PR (attributed
# to whoever happened to bump the submodule pointer).
#
# This workflow checks out AmbiqAI/ns-cmsis-nn at a configurable ref (default
# main; the catalog check uses the firmware pin), points CMSIS_NN_ROOT at it,
# and runs generation + a compile of the generated harnesses (no FVP
# execution) for one representative Cortex-M55 int + float profile. That is
# enough to catch every class of breakage described in #50 without paying for
# a full FVP run in this repo (the full FVP suite still runs downstream in
# ns-cmsis-nn's own CI once the submodule pointer is bumped). The one exception is
# the contract-conformance job, which runs its small case grid on the FVP for each
# library build the planner plans.

on:
  # Draft PRs skip every job (see each job's `if`). `ready_for_review` runs
  # them when a draft is marked ready; `converted_to_draft` replaces a ready
  # PR's result with a skipped run. Neither is a default type.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - main
      - 'dev/**'
  push:
    branches:
      - main
      - 'dev/**'
  workflow_dispatch:
    inputs:
      ns_cmsis_nn_ref:
        description: >-
          ns-cmsis-nn ref (branch, tag, or SHA) to validate against. Use this
          to exercise new descriptors/templates against kernel changes that
          have not merged to ns-cmsis-nn main yet. Empty means main for
          generate-and-compile and the firmware's CMSIS_NN_REF for
          mutation-catalog.
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The mutation catalog patches kernel source by literal text. Only a real
  # checkout can show that a pattern or its replacement count has drifted, so
  # this job applies every catalogued mutant to one.
  mutation-catalog:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helia-core-tester
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies (no ARM toolchain needed)
        run: ./scripts/setup_ci.sh --skip-build-deps

      - name: Read the firmware's ns-cmsis-nn pin
        id: pin
        run: |
          ref=$(uv run python -c "from helia_core_tester.hardware.nsx_app import CMSIS_NN_REF; print(CMSIS_NN_REF)")
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Firmware pin; main rewrites break patterns.
      - name: Checkout ns-cmsis-nn
        uses: actions/checkout@v4
        with:
          repository: AmbiqAI/ns-cmsis-nn
          ref: ${{ github.event.inputs.ns_cmsis_nn_ref || steps.pin.outputs.ref }}
          path: ns-cmsis-nn-scratch

      - name: Apply every catalogued mutant to the checkout
        env:
          HELIA_CORE_TESTER_MUTATION_CHECKOUT: ${{ github.workspace }}/ns-cmsis-nn-scratch
        run: |
          uv run pytest helia_core_tester/tests/test_mutation_scoring.py -q \
            -k every_v1_edit_applies_to_a_real_checkout \
            --no-header -rs

  generate-and-compile:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - int
          - float

    steps:
      - name: Checkout helia-core-tester
        uses: actions/checkout@v4

      - name: Checkout ns-cmsis-nn
        uses: actions/checkout@v4
        with:
          repository: AmbiqAI/ns-cmsis-nn
          ref: ${{ github.event.inputs.ns_cmsis_nn_ref || 'dev/kernel-contracts' }}
          path: ns-cmsis-nn-scratch

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache helia-core-tester downloads
        uses: actions/cache@v4
        with:
          path: artifacts/downloads
          key: helia-core-tester-downloads-${{ runner.os }}-${{ hashFiles('scripts/setup_ci.sh', 'helia_core_tester/scripts/setup_dependencies.py') }}
          restore-keys: |
            helia-core-tester-downloads-${{ runner.os }}-

      - name: Setup build dependencies
        run: ./scripts/setup_ci.sh

      # A fresh run seed per workflow run, so every run draws new data; the log
      # and the generation report record it for reproduction (--seed <run id>).
      - name: Generate + compile (no FVP run) against ns-cmsis-nn ${{ github.event.inputs.ns_cmsis_nn_ref || 'dev/kernel-contracts' }}
        run: |
          uv run helia_core_tester full \
            --cpu cortex-m55 \
            --suite ${{ matrix.suite }} \
            --seed ${{ github.run_id }} \
            --cmsis-nn-root "${{ github.workspace }}/ns-cmsis-nn-scratch" \
            --skip-run \
            --no-report \
            --verbosity 1

  # The kernel contract leg (helia-core-tester dev/kernel-contracts, iteration 1).
  # `present` runs against the ns-cmsis-nn ref under test: the export must load, the
  # inventory must cover real cases, and the real-tree contract tests must run to a
  # pass. `absent` runs against the last ns-cmsis-nn tag without the export and
  # proves the tester degrades explicitly: inventory refused with exit 2, the
  # real-tree tests skipped (not silently passed), doctor reporting the absence,
  # and a migrated template failing closed instead of rendering a hand-written call.
  # scripts/assert_contract_summary.py turns those observations into the verdict.
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: present
            # ns-cmsis-nn dev/kernel-contracts carries the export until it merges to main.
            ns_cmsis_nn_ref: ${{ github.event.inputs.ns_cmsis_nn_ref || 'dev/kernel-contracts' }}
          - leg: absent
            ns_cmsis_nn_ref: v7.35.1

    env:
      CMSIS_NN_ROOT: ${{ github.workspace }}/ns-cmsis-nn-scratch
      CONTRACT_TESTS: >-
        helia_core_tester/tests/test_contract_symbol_audit.py
        helia_core_tester/tests/test_contract_render.py
      CONTRACT_TEST_NAMES: >-
        --test test_real_tree_symbols_are_declared_or_known_drift
        --test test_parity_assert_against_the_real_headers

    steps:
      - name: Checkout helia-core-tester
        uses: actions/checkout@v4

      - name: Checkout ns-cmsis-nn ${{ matrix.ns_cmsis_nn_ref }}
        uses: actions/checkout@v4
        with:
          repository: AmbiqAI/ns-cmsis-nn
          ref: ${{ matrix.ns_cmsis_nn_ref }}
          path: ns-cmsis-nn-scratch

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache helia-core-tester downloads
        uses: actions/cache@v4
        with:
          path: artifacts/downloads
          key: helia-core-tester-downloads-${{ runner.os }}-${{ hashFiles('scripts/setup_ci.sh', 'helia_core_tester/scripts/setup_dependencies.py') }}
          restore-keys: |
            helia-core-tester-downloads-${{ runner.os }}-

      - name: Setup build dependencies
        run: ./scripts/setup_ci.sh

      # doctor's own exit code is not the verdict here (the assert step reads its
      # kernel-contract section); keep the log even when another check complains.
      - name: Doctor
        run: |
          set +e
          uv run helia_core_tester doctor 2>&1 | tee contract-doctor.log
          echo "doctor exit: ${PIPESTATUS[0]}"

      - name: Generate cortex-m55 int + float (present leg)
        if: matrix.leg == 'present'
        run: uv run helia_core_tester generate --cpu cortex-m55 --suite both --seed ${{ github.run_id }} --verbosity 1

      - name: Generate one Convolve case against a checkout without the export (absent leg)
        if: matrix.leg == 'absent'
        run: |
          set +e
          uv run helia_core_tester generate --op Convolve --limit 1 --cpu cortex-m55 --suite int --verbosity 2 \
            2>&1 | tee contract-generate.log
          status=${PIPESTATUS[0]}
          set -e
          echo "generate exit: $status"
          test "$status" -ne 0

      # --allow-unknown: the nhwc pooling aliases the float templates call are not
      # public declarations (helia-core-tester#205); the report still lists every
      # unknown symbol, and the gate flips once #205 is resolved.
      - name: Contract inventory
        run: |
          set +e
          uv run helia_core_tester contract inventory --generated-tests-dir artifacts/generated_tests \
            --allow-unknown 2>&1 | tee contract-inventory.log
          echo "${PIPESTATUS[0]}" > contract-inventory.exit
          set -e
          echo "inventory exit: $(cat contract-inventory.exit)"

      - name: Real-tree contract tests
        env:
          HELIA_CORE_TESTER_REQUIRE_CONTRACT: ${{ matrix.leg == 'present' && '1' || '' }}
        run: |
          uv run pytest ${CONTRACT_TESTS} -q -p no:cacheprovider \
            -k "real_tree or real_headers" --junitxml contract-junit.xml --no-header -rs

      - name: Assert the ${{ matrix.leg }} leg
        run: |
          extra=""
          if [ "${{ matrix.leg }}" = "present" ]; then
            extra="--report artifacts/reports/contracts/inventory.json"
          else
            extra="--generate-log contract-generate.log"
          fi
          uv run python scripts/assert_contract_summary.py --expect ${{ matrix.leg }} \
            --inventory-exit "$(cat contract-inventory.exit)" --junit contract-junit.xml \
            ${CONTRACT_TEST_NAMES} --doctor-log contract-doctor.log $extra

      - name: Upload contract report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-${{ matrix.leg }}
          path: |
            artifacts/reports/contracts/inventory.json
            contract-*.log
            contract-junit.xml
          if-no-files-found: ignore

  # Contract conformance (Phase 2 T4a/T5, AmbiqAI/ns-cmsis-nn#829). The `conformance: true` cases run on the FVP for
  # each build the planner plans: m0 scalar, m4 DSP, m55 MVE, and m55 MVE with ARM_MATH_AUTOVECTORIZE (the coverage
  # build). Each asserts on the target that ctx is exactly the planned size, that the wrapper's own selector takes
  # the planned route, and, for the packed FC entry, that the stream equals the host packer's
  # (generation/conformance.py). `present` legs require the contract
  # (HELIA_CORE_TESTER_REQUIRE_CONTRACT turns a missing planner into a failure). The `absent` leg runs against the
  # last ns-cmsis-nn tag without the export and proves the cases skip with a reason instead of passing by omission.
  # scripts/conformance_leg.py turns the generation manifest into the verdict.
  contract-conformance:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: present, profile: m0, cpu: cortex-m0, coverage: false}
          - {leg: present, profile: m4, cpu: cortex-m4, coverage: false}
          - {leg: present, profile: m55, cpu: cortex-m55, coverage: false}
          - {leg: present, profile: m55-autovec, cpu: cortex-m55, coverage: true}
          - {leg: absent, profile: absent, cpu: cortex-m55, coverage: false}

    env:
      CMSIS_NN_ROOT: ${{ github.workspace }}/ns-cmsis-nn-scratch

    steps:
      - name: Checkout helia-core-tester
        uses: actions/checkout@v4

      - name: Checkout ns-cmsis-nn
        uses: actions/checkout@v4
        with:
          repository: AmbiqAI/ns-cmsis-nn
          # The export, the manifest and ns_cmsis_nn_contracts live on dev/kernel-contracts until it merges to main.
          ref: ${{ matrix.leg == 'absent' && 'v7.35.1' || github.event.inputs.ns_cmsis_nn_ref || 'dev/kernel-contracts' }}
          path: ns-cmsis-nn-scratch

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache helia-core-tester downloads
        uses: actions/cache@v4
        with:
          path: artifacts/downloads
          key: helia-core-tester-downloads-${{ runner.os }}-${{ hashFiles('scripts/setup_ci.sh', 'helia_core_tester/scripts/setup_dependencies.py') }}
          restore-keys: |
            helia-core-tester-downloads-${{ runner.os }}-

      - name: Setup build dependencies
        run: ./scripts/setup_ci.sh

      - name: List the conformance cases
        id: cases
        run: echo "names=$(uv run python scripts/conformance_leg.py names)" >> "$GITHUB_OUTPUT"

      - name: Run the conformance cases on the FVP (${{ matrix.profile }})
        if: matrix.leg == 'present'
        env:
          HELIA_CORE_TESTER_REQUIRE_CONTRACT: '1'
        run: |
          uv run helia_core_tester full \
            --cpu ${{ matrix.cpu }} \
            --suite int \
            --seed ${{ github.run_id }} \
            --name "${{ steps.cases.outputs.names }}" \
            --cmsis-nn-root "${CMSIS_NN_ROOT}" \
            ${{ matrix.coverage && '--coverage' || '' }} \
            --verbosity 1 2>&1 | tee conformance-${{ matrix.profile }}.log
          exit "${PIPESTATUS[0]}"

      - name: Generate the conformance cases against a checkout without the contract (absent leg)
        if: matrix.leg == 'absent'
        run: |
          uv run helia_core_tester generate \
            --cpu ${{ matrix.cpu }} \
            --suite int \
            --name "${{ steps.cases.outputs.names }}" \
            --verbosity 1 2>&1 | tee conformance-${{ matrix.profile }}.log
          exit "${PIPESTATUS[0]}"

      - name: Assert the ${{ matrix.leg }} leg (${{ matrix.profile }})
        run: uv run python scripts/conformance_leg.py check --expect ${{ matrix.leg }} --cpu ${{ matrix.cpu }}

      - name: Upload conformance reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-conformance-${{ matrix.profile }}
          path: |
            conformance-*.log
            artifacts/reports/generation/int/${{ matrix.cpu }}/
            artifacts/generated_tests/int/${{ matrix.cpu }}/manifest.json
          if-no-files-found: ignore
