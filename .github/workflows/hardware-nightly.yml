name: Hardware Nightly

# Mirrors helia-profiler's hardware-validation.yml shape.

on:
  schedule:
    # Clears hpx's 09:00 UTC nightly.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      boards:
        description: "Comma-separated board ids, one job each"
        required: true
        default: apollo510_evb,apollo330mP_evb,apollo3p_evb
        type: string
      suite:
        description: "Generated-test suite"
        required: true
        default: both
        type: choice
        options: [both, int, float]
      limit:
        description: "Tests per family and suite; empty runs all"
        required: false
        default: ""
        type: string
      pmu_counters:
        description: "Space-separated --pmu-counters values; PMU boards only"
        required: true
        default: all
        type: string
      cmsis_nn_ref:
        description: "ns-cmsis-nn branch, tag or full SHA for the kernel leg"
        required: true
        default: main
        type: string

defaults:
  run:
    shell: bash

env:
  # Caches beside the workspace survive checkout's clean.
  UV_CACHE_DIR: ${{ github.workspace }}/../hct-uv-cache
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/../hct-uv-python
  HCT_CACHE_DIR: ${{ github.workspace }}/../hct-cache
  # Schedule has no inputs; use defaults.
  HCT_NIGHTLY_BOARDS: ${{ inputs.boards || 'apollo510_evb,apollo330mP_evb,apollo3p_evb' }}
  HCT_NIGHTLY_SUITE: ${{ inputs.suite || 'both' }}
  HCT_NIGHTLY_LIMIT: ${{ inputs.limit }}
  HCT_NIGHTLY_PMU: ${{ inputs.pmu_counters || 'all' }}
  HCT_NIGHTLY_REF: ${{ inputs.cmsis_nn_ref || 'main' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      boards: ${{ steps.matrix.outputs.boards }}
      date: ${{ steps.matrix.outputs.date }}
      kernel_leg: ${{ steps.ref.outputs.leg }}
      kernel_sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Checkout the board table
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            assets/hardware_boards.yaml
            scripts/resolve_kernel_ref.sh
          sparse-checkout-cone-mode: false
      - name: Build the board matrix
        id: matrix
        run: |
          # Unique ids: one artifact name each.
          boards="$(jq -cn --arg csv "${HCT_NIGHTLY_BOARDS}" \
            '$csv | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | unique')"
          if [[ "${boards}" == "[]" ]]; then
            echo "::error::boards input selects no boards" >&2
            exit 2
          fi
          # Unknown labels queue for a day.
          known="$(sed -n 's/^ *- id: *//p' assets/hardware_boards.yaml)"
          # One element per line; no word splitting.
          while IFS= read -r board; do
            if ! grep -qxF -- "${board}" <<< "${known}"; then
              echo "::error::unknown board '${board}'; see assets/hardware_boards.yaml" >&2
              exit 2
            fi
          done < <(jq -r '.[]' <<< "${boards}")
          {
            echo "boards=${boards}"
            echo "date=$(date -u +%Y%m%d)"
          } >> "${GITHUB_OUTPUT}"
      # A SHA keeps every board on one commit.
      - name: Resolve the kernel ref
        id: ref
        # No ref skips the kernel leg only.
        continue-on-error: true
        # A stalled lookup must not sink plan.
        timeout-minutes: 2
        run: scripts/resolve_kernel_ref.sh

  run:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.plan.outputs.boards) }}
    # Board label picks its owning runner.
    runs-on: [self-hosted, hpx-hardware, "${{ matrix.board }}"]
    # Lock wait plus four legs.
    timeout-minutes: 195
    env:
      HCT_NIGHTLY_BOARD: ${{ matrix.board }}
      HCT_RUN_JSON: ${{ github.workspace }}/artifacts/reports/hardware-nightly-run.json
      HCT_MRAM_RUN_JSON: ${{ github.workspace }}/artifacts/reports/hardware-nightly-mram-run.json
      HCT_KERNEL_RUN_JSON: ${{ github.workspace }}/artifacts/reports/hardware-nightly-kernel-run.json
      HCT_ATFE_RUN_JSON: ${{ github.workspace }}/artifacts/reports/hardware-nightly-atfe-run.json
      HCT_KERNEL_LEG: ${{ needs.plan.outputs.kernel_leg }}
    steps:
      # Every attempt replaces its artifact.
      - name: Stage a no-result marker
        run: |
          for upload in hct-upload hct-mram-upload hct-kernel-upload hct-atfe-upload; do
            mkdir -p "${RUNNER_TEMP}/${upload}"
            echo "no result" > "${RUNNER_TEMP}/${upload}/NO_RESULT"
          done

      - name: Resolve board and probe from the runner
        run: |
          if [[ -z "${HPX_BOARD:-}" || -z "${HPX_JLINK_SERIAL:-}" ]]; then
            echo "::error::runner exports no HPX_BOARD or HPX_JLINK_SERIAL" >&2
            exit 2
          fi
          if [[ "${HPX_BOARD}" != "${HCT_NIGHTLY_BOARD}" ]]; then
            echo "::error::runner owns ${HPX_BOARD}, not ${HCT_NIGHTLY_BOARD}" >&2
            exit 2
          fi
          # uv's CPython has no CA bundle here.
          if [[ -z "${SSL_CERT_FILE:-}" && -f /etc/ssl/certs/ca-certificates.crt ]]; then
            echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "${GITHUB_ENV}"
          fi
          {
            echo "HCT_SESSION_ID=nightly-${GITHUB_RUN_ID}-${HPX_BOARD}"
            echo "HCT_MRAM_SESSION_ID=nightly-mram-${GITHUB_RUN_ID}-${HPX_BOARD}"
            echo "HCT_KERNEL_SESSION_ID=nightly-${HCT_KERNEL_LEG}-${GITHUB_RUN_ID}-${HPX_BOARD}"
            echo "HCT_ATFE_SESSION_ID=nightly-atfe-${GITHUB_RUN_ID}-${HPX_BOARD}"
          } >> "${GITHUB_ENV}"

      # hpx's bench lock; ttl frees it.
      - name: Take the board lock
        id: lock
        run: |
          if [[ -z "${BENCH_BOARD:-}" ]] || ! command -v bench-agent > /dev/null; then
            echo "::error::runner has no BENCH_BOARD or bench-agent" >&2
            exit 2
          fi
          # Untagged: runner orphan cleanup skips it.
          if ! held="$(env -u RUNNER_TRACKING_ID bench-agent lock "${BENCH_BOARD}" \
              --holder ci \
              --reason "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --timeout 1800 \
              --ttl 12600 2>&1)"; then
            echo "::error::${held}" >&2
            exit 1
          fi
          echo "${held}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Keep the bench's warm uv cache.
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR }}

      # Fetch ARM GCC once per pin.
      - name: Link the download cache
        run: |
          # hashFiles needs node20, absent here.
          pin="$(sha256sum helia_core_tester/scripts/setup_dependencies.py | cut -c1-16)"
          HCT_DOWNLOADS="${HCT_CACHE_DIR}/downloads-${pin}"
          mkdir -p "${HCT_DOWNLOADS}" artifacts
          rm -rf artifacts/downloads
          ln -s "${HCT_DOWNLOADS}" artifacts/downloads

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Run the hardware kernel suite
        id: suite
        run: |
          # Pass placement; switches do not persist.
          scripts/nightly_leg.sh "${HCT_SESSION_ID}" "${HCT_CACHE_DIR}/hardware/${HPX_BOARD}" "${HCT_RUN_JSON}" \
            --placement tcm

      # Weights in cached MRAM; MRAM boards only.
      - name: Run the MRAM-placement leg
        id: mram
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        run: |
          mram="$(uv run python -c 'import sys; from helia_core_tester.hardware.boards import resolve_board; print(resolve_board(sys.argv[1]).has_mram)' "${HPX_BOARD}")"
          if [[ "${mram}" != "True" ]]; then
            echo "${HPX_BOARD} has no cached MRAM; skipping"
            echo "absent=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          scripts/nightly_leg.sh "${HCT_MRAM_SESSION_ID}" "${HCT_CACHE_DIR}/hardware/${HPX_BOARD}-mram" "${HCT_MRAM_RUN_JSON}" \
            --placement mram --skip-generate

      # Non-gating: main may break; summary shows it.
      - name: Run the kernel-ref leg
        id: kernel
        if: ${{ !cancelled() && needs.plan.outputs.kernel_sha != '' && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        continue-on-error: true
        # A stall must not sink the job.
        timeout-minutes: 45
        env:
          KERNEL_SHA: ${{ needs.plan.outputs.kernel_sha }}
        run: |
          scripts/nightly_leg.sh "${HCT_KERNEL_SESSION_ID}" "${HCT_CACHE_DIR}/hardware/${HPX_BOARD}-${HCT_KERNEL_LEG}" \
            "${HCT_KERNEL_RUN_JSON}" --placement tcm --skip-generate --cmsis-nn-ref "${KERNEL_SHA}"

      # Non-gating: atfe speed and size series.
      - name: Run the atfe leg
        id: atfe
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 45
        run: |
          # Runner units export ATFE_ROOT; annotate early.
          if [[ -z "${ATFE_ROOT:-}" || ! -x "${ATFE_ROOT}/bin/clang" ]]; then
            echo "::error::runner has no ATfE clang under ATFE_ROOT='${ATFE_ROOT:-}'" >&2
            exit 2
          fi
          scripts/nightly_leg.sh "${HCT_ATFE_SESSION_ID}" "${HCT_CACHE_DIR}/hardware/${HPX_BOARD}-atfe" "${HCT_ATFE_RUN_JSON}" \
            --placement tcm --skip-generate --toolchain atfe

      - name: Release the board lock
        if: always() && steps.lock.outcome == 'success'
        run: |
          if ! freed="$(bench-agent unlock "${BENCH_BOARD}" 2>&1)"; then
            if [[ "${freed}" != *"is free"* ]]; then
              echo "::error::${freed}" >&2
              exit 1
            fi
          fi
          echo "${freed}"

      # Only after the suite ran: checkout cleans stale reports.
      - name: Stage the result bundles
        if: always() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure')
        run: |
          # One leg's session per artifact.
          for leg in "${HCT_SESSION_ID}:${HCT_RUN_JSON}:hct-upload" "${HCT_MRAM_SESSION_ID}:${HCT_MRAM_RUN_JSON}:hct-mram-upload" \
              "${HCT_KERNEL_SESSION_ID}:${HCT_KERNEL_RUN_JSON}:hct-kernel-upload" \
              "${HCT_ATFE_SESSION_ID}:${HCT_ATFE_RUN_JSON}:hct-atfe-upload"; do
            IFS=: read -r session run_json upload <<< "${leg}"
            if [[ -d "artifacts/reports/hardware/${session}" ]]; then
              mkdir -p "${RUNNER_TEMP}/${upload}/hardware"
              cp -r "artifacts/reports/hardware/${session}" "${RUNNER_TEMP}/${upload}/hardware/"
            fi
            # Keep the marker until results exist.
            if [[ -s "${run_json}" ]]; then
              cp "${run_json}" "${RUNNER_TEMP}/${upload}/hardware-nightly-run.json"
              rm -f "${RUNNER_TEMP}/${upload}/NO_RESULT"
            fi
          done

      # Re-runs replace the first attempt's artifact.
      - name: Upload the result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hct-hardware-${{ matrix.board }}-${{ needs.plan.outputs.date }}-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/hct-upload/
          include-hidden-files: true
          if-no-files-found: warn

      # Own prefix: the dashboard keys hct-hardware-* by board.
      - name: Upload the MRAM-leg bundle
        # Early failures still show no result.
        if: always() && steps.mram.outcome != 'skipped' && steps.mram.outputs.absent != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hct-mram-${{ matrix.board }}-${{ needs.plan.outputs.date }}-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/hct-mram-upload/
          include-hidden-files: true
          if-no-files-found: warn

      # hct-main-* for main, hct-ref-* otherwise.
      - name: Upload the kernel-ref bundle
        if: always() && steps.kernel.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: hct-${{ needs.plan.outputs.kernel_leg }}-${{ matrix.board }}-${{ needs.plan.outputs.date }}-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/hct-kernel-upload/
          include-hidden-files: true
          if-no-files-found: warn

      # Same layout as hct-hardware-*.
      - name: Upload the atfe-leg bundle
        if: always() && steps.atfe.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: hct-atfe-${{ matrix.board }}-${{ needs.plan.outputs.date }}-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/hct-atfe-upload/
          include-hidden-files: true
          if-no-files-found: warn

  # Minimal per-board table; board-matrix may replace it.
  summary:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOARDS: ${{ needs.plan.outputs.boards }}
      RUN_TAG: ${{ needs.plan.outputs.date }}-${{ github.run_id }}
      KERNEL_LEG: ${{ needs.plan.outputs.kernel_leg }}
      KERNEL_SHA: ${{ needs.plan.outputs.kernel_sha }}
    steps:
      # No artifacts: boards show "no result".
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          pattern: hct-*-${{ github.run_id }}
          path: bundles
      - name: Summarise per board
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          {
            echo "### Hardware nightly"
            echo ""
            if [[ "${DOWNLOAD_OUTCOME}" != "success" ]]; then
              echo "Artifact download failed or found none; see the download step."
              echo ""
            fi
            if [[ -n "${KERNEL_LEG}" ]]; then
              echo "Leg ${KERNEL_LEG} targets ns-cmsis-nn ${KERNEL_SHA}; it does not gate the run."
            else
              echo "Kernel ref did not resolve; kernel leg skipped."
            fi
            echo ""
            echo "| Board | Leg | Ran | Passed | Failed | Skipped | Boot | Core MHz | Build id | Kernel |"
            echo "|---|---|---|---|---|---|---|---|---|---|"
            for board in $(jq -r '.[]' <<< "${BOARDS}"); do
              # Leg name, then its artifact prefix.
              for leg in tcm:hct-hardware mram:hct-mram "${KERNEL_LEG}:hct-${KERNEL_LEG}" atfe:hct-atfe; do
                IFS=: read -r name prefix <<< "${leg}"
                [[ -n "${name}" ]] || continue
                dir="bundles/${prefix}-${board}-${RUN_TAG}"
                run_json="${dir}/hardware-nightly-run.json"
                if [[ ! -s "${run_json}" ]]; then
                  # MRAM leg skips non-MRAM boards.
                  [[ "${name}" == mram && ! -d "${dir}" ]] && continue
                  echo "| ${board} | ${name} | no result | | | | | | | |"
                  continue
                fi
                manifest="${dir}/hardware/$(jq -r .session_id "${run_json}")/session_manifest.json"
                [[ -f "${manifest}" ]] || manifest=/dev/null
                jq -r --arg leg "${name}" --slurpfile m "${manifest}" '
                  ($m[0] // {}) as $m
                  | [ .board, $leg, .totals.ran, .totals.passed, .totals.failed, .totals.skipped,
                      (.boot.status // "n/a"),
                      (if .boot.core_clock_hz then .boot.core_clock_hz / 1e6 else "n/a" end),
                      ($m.firmware_build_id // "n/a"),
                      ($m.build.kernels.commit // $m.build.kernels.ref // "n/a") ]
                  | "| " + (map(tostring) | join(" | ")) + " |"
                ' "${run_json}"
              done
            done
          } >> "${GITHUB_STEP_SUMMARY}"
