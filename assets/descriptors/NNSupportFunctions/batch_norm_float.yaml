# Non-finite cover for the float batch-norm kernels. arm_batch_norm_f32/f16 document
# no non-finite behaviour, so nonfinite_policy is mask: the lanes whose reference
# output is non-finite are don't-care and the case asserts SUCCESS, no fault, no
# hang, and correct finite lanes around the tokens.
operator: BatchNorm
name: batch_norm_nonfinite_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 4, 4, 3]
layout: ARM_NN_LAYOUT_NHWC
input_mode: nonfinite_sweep
nonfinite_policy: mask
