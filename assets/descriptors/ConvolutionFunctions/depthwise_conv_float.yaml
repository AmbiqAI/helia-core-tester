---
# Non-finite cover for the float depthwise convolution kernels. arm_depthwise_conv_f32
# and arm_depthwise_conv_f16 (Include/arm_nnfunctions_flt.h:103 and :1370, the f16 entry
# a @copydoc of the f32 one) say nothing about NaN or Inf, so nonfinite_policy is mask:
# the output positions whose receptive field contains the token are don't-care, and the
# case asserts SUCCESS, no fault, no hang and every other lane within the case tolerance.
#
# Depthwise keeps channels independent, so the token at input element 0 -- the
# (h=0, w=0, c=0) corner -- reaches channel 0 of four output positions only: 4 of 1024
# output elements are masked and 99.6% stay asserted strictly. The three untouched
# channels are what catch a leg that spreads the token sideways.
#
# One token per case, because a depthwise accumulator is a reduction group: all three
# tokens in one case would put +Inf and -Inf in the same dot product.
---
operator: DepthwiseConv
name: depthwise_conv_float_nonfinite_nan_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
input_shape: [1, 16, 16, 4]
filter_shape: [3, 3, 4, 1]
strides: [1, 1]
padding: SAME
use_bias: true
depth_multiplier: 1
input_mode: nonfinite_sweep
nonfinite_tokens: [nan]
nonfinite_policy: mask
---
operator: DepthwiseConv
name: depthwise_conv_float_nonfinite_inf_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
input_shape: [1, 16, 16, 4]
filter_shape: [3, 3, 4, 1]
strides: [1, 1]
padding: SAME
use_bias: true
depth_multiplier: 1
input_mode: nonfinite_sweep
nonfinite_tokens: [inf]
nonfinite_policy: mask
---
operator: DepthwiseConv
name: depthwise_conv_float_nonfinite_neginf_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
input_shape: [1, 16, 16, 4]
filter_shape: [3, 3, 4, 1]
strides: [1, 1]
padding: SAME
use_bias: true
depth_multiplier: 1
input_mode: nonfinite_sweep
nonfinite_tokens: [-inf]
nonfinite_policy: mask
---
operator: DepthwiseConv
name: depthwise_conv_float_nonfinite_nan_f16
suite: float
activation_dtype: FP16
weight_dtype: FP16
tensor_dtypes:
  input: FP16
  output: FP16
  weights: FP16
  bias: FP16
input_shape: [1, 16, 16, 4]
filter_shape: [3, 3, 4, 1]
strides: [1, 1]
padding: SAME
use_bias: true
depth_multiplier: 1
# The unmasked lanes here are a 9-tap f16 multiply-accumulate chain compared against a
# float32 reference model, so the rounding floor of the accumulation alone consumes the
# FP16 default budget; the tokens play no part, and a token-free case of this shape
# fails at the same lane with the same numbers. The override is sized off the worst
# fraction seen across several generation seeds, not off one run.
comparison:
  atol: 0.002
  rtol: 0.002
input_mode: nonfinite_sweep
nonfinite_tokens: [nan]
nonfinite_policy: mask
---
operator: DepthwiseConv
name: depthwise_conv_float_nonfinite_inf_f16
suite: float
activation_dtype: FP16
weight_dtype: FP16
tensor_dtypes:
  input: FP16
