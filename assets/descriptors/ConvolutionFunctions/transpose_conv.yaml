input_shape:
- 1
- 5
- 5
- 8
filter_shape:
- 4
- 6
- 8
- 4
strides:
- 2
- 2
padding: SAME
use_bias: true
---
# helia-core-tester#58: pad_w % stride_w != 0 (column remainder), pad_h % stride_h == 0.
# kernel_h=6, stride_h=2 -> pad_total_h=4, pad_h=2, 2 % 2 = 0.
# kernel_w=4, stride_w=2 -> pad_total_w=2, pad_w=1, 1 % 2 = 1 (!= 0).
