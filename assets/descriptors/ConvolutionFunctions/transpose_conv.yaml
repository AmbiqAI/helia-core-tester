# Exact scratch sizes (issue #69), measured by calling the real, unmodified
# arm_transpose_conv_s8_get_buffer_size{,_mve}() and
# arm_transpose_conv_s8_get_reverse_conv_buffer_size() on host for this case's
# actual generated dims (input=[1,9,9,9] filter=[9,6,6,9] output=[1,18,18,9],
# stride=2x2). input_c=9 does not clear REVERSE_TCOL_EFFICIENT_THRESHOLD (16),
# so the reverse-conv route is never taken: reverse buffer size is the
# documented degenerate-0 case, and the ctx size is the ISA-independent
# rolling-buffer formula (same in every leg since MVE/DSP/generic all fall
# back to it here).
expected_buffer_size: 4752
expected_reverse_buffer_size: 0
