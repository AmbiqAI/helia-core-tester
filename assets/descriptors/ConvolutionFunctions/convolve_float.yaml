  output: FP32
  weights: FP32
  bias: FP32
input_shape: [1, 4, 70, 1]
filter_shape: [3, 3, 1, 8]
strides: [3, 3]
padding: SAME
use_bias: true
---
# Stride 4: VLD4 interior groups in f32, gathered interior groups in f16.
operator: Convolve
name: convolve_float_small_c1_k3_same_stride4_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
input_shape: [1, 5, 77, 1]
filter_shape: [3, 3, 1, 8]
strides: [4, 4]
padding: SAME
use_bias: true
---
