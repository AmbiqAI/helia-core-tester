---
# Direct small-input-channel float kernel (ns-cmsis-nn#417): input_c < one vector, lanes are
# output x positions. Width 30 at stride 1 gives a left edge group, contiguous interior groups
# (VLD1) and a partial tail group for both the 4-lane f32 and 8-lane f16 kernels.
operator: Convolve
name: convolve_float_small_c1_k3_same_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
input_shape: [1, 6, 30, 1]
filter_shape: [3, 3, 1, 8]
strides: [1, 1]
padding: SAME
use_bias: true
---
# Width 61 at stride 2: edge, VLD2 interior groups and a tail for both lane widths.
operator: Convolve
name: convolve_float_small_c1_k3_same_stride2_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
input_shape: [1, 5, 61, 1]
filter_shape: [3, 3, 1, 8]
strides: [2, 2]
padding: SAME
use_bias: true
---
# Stride 3 has no contiguous load form: interior groups gather, edges and the last group predicate.
operator: Convolve
name: convolve_float_small_c1_k3_same_stride3_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
