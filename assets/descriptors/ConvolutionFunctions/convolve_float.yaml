name: convolve_float_small_c1_k3_same_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
input_shape: [1, 6, 30, 1]
filter_shape: [3, 3, 1, 8]
strides: [1, 1]
padding: SAME
use_bias: true
---
