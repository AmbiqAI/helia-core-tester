---
# Strided 1xN FP16 kernel: shapes outside the in-place contiguous-K route, which takes
# Cout >= 4 && ((Cout % 8 >= 4 && K >= 80) || K >= 224) with K = kernel_w * Cin, so the
# no-padding rows keep running the strided dual/8/4-row blocks, the fold and the remainder dot.
# Width kernel_w + 15: VALID gives 16 output columns, SAME 16 no-padding rows.
# Their error is the strided kernel's own blockwise FP16 precision (float16 lane partials folded
# into float32 every 32 taps; _acc16 stays in float16), identical on ns-cmsis-nn 5f3fed9f and #663.
# K = 280 with Cout 3 is the only shape past one 256-element fold span, so it alone runs the dot
# fold's multi-block loop; Cout < 4 never takes the in-place route.
operator: Convolve
name: convolve_float_1xn_strided_c14_k7_oc16_same_f16
suite: float
activation_dtype: FP16
weight_dtype: FP16
tensor_dtypes: {input: FP16, output: FP16, weights: FP16, bias: FP16}
