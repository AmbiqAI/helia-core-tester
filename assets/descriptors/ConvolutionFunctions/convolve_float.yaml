# Direct small-input-channel float kernel (ns-cmsis-nn#417): input_c < one vector, lanes are
# output x positions. Width 30 at stride 1 gives a left edge group, contiguous interior groups
# (VLD1) and a partial tail group for both the 4-lane f32 and 8-lane f16 kernels.
