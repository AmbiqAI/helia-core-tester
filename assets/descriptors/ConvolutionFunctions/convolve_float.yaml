# FP16 comparisons: a case without a comparison uses the FP16 default (atol = rtol = 1e-3). A stated
# comparison is the smallest of 0.002/0.003/0.004/0.005/0.01 that keeps the worst error over the
# data seeds 500 and 1-8 within 0.8 of the tolerance on every cortex-m55 FP16 leg of ns-cmsis-nn's
# CI (shipped flags, MVE float coverage, fallback coverage).
operator: Convolve
name: convolve_float_default_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
input_shape: [1, 6, 6, 3]
filter_shape: [3, 3, 3, 5]
strides: [1, 1]
padding: SAME
use_bias: true
