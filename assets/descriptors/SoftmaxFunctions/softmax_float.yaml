# Non-finite cover for the float softmax kernels. arm_softmax_f32/f16 document no
# non-finite behaviour (Include/arm_nnfunctions_flt.h:1258-1268 specifies arguments
# and return status only), so nonfinite_policy is mask.
#
# One token per case, because softmax is a spreading op: the row maximum and the
# exponential sum fold the whole row, so a row holding both +Inf and -Inf would make
# the golden a statement about (+Inf) - (+Inf) rather than about the kernel. The
# input is two rows of four, so the swept row absorbs the token and the second row
# stays finite and fully asserted -- that second row is what catches a vector leg
# that poisons a whole register rather than one lane.
operator: Softmax
name: softmax_float_nonfinite_nan_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 2, 1, 4]
input_mode: nonfinite_sweep
nonfinite_tokens: [nan]
nonfinite_policy: mask
---
