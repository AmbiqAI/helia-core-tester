---
# Non-finite cover for the float split kernel. Split is pure data movement, so
# bit-exact pass-through of NaN, +Inf and -Inf is the only correct behaviour and the
# policy is strict. No contract citation is available or needed: a copy has nothing
# to specify. Only f16 is covered because arm_split has no f32 leg in the generator's
# kernel table.
operator: Split
name: split_float_nonfinite_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_shape: [1, 2, 2, 4]
axis: -1
num_splits: 2
input_mode: nonfinite_sweep
nonfinite_policy: strict
---
# # ns-cmsis-nn#475 shapes: arm_split_f32 is new and arm_split_f16 moved onto the shared
# # any-rank axis-copy core in the same change, so every case below carries
# # required_kernel_symbols and skips as skipped_kernel_symbol on a checkout that predates
# # it (the f16 cases pin the f32 sibling too, because the rank-1/2/5, zero-extent and
# # unequal-length behaviour they assert is the #475 contract, not the older f16 kernel's).
# # Goldens are numpy.split; the kernel is a bit copy, so the comparison is zero-tolerance.
operator: Split
name: split_float_channels_pairs_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
comparison: {atol: 0.0, rtol: 0.0}
required_kernel_symbols: [arm_split_f32]
input_shape: [1, 2, 2, 4]
axis: -1
num_splits: 2
---
