# # arm_pack_f32/f16 (ns-cmsis-nn#475, TFLite PACK): num_inputs equal-shape tensors stacked
# # along a new axis at any position 0..rank, rank-0 inputs included. Goldens are numpy.stack;
# # the kernel is a bit copy, so the comparison is zero-tolerance. required_kernel_symbols
# # skips every case on a checkout without the symbol.
operator: Pack
name: pack_float_rank0_n8_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
comparison: {atol: 0.0, rtol: 0.0}
required_kernel_symbols: [arm_pack_f32]
input_shape: []
num_inputs: 8
axis: 0
