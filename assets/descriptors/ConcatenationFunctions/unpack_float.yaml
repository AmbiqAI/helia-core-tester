# # arm_unpack_f32/f16 (ns-cmsis-nn#475, TFLite UNPACK): input_shape[axis] outputs, each the
# # input with that axis fixed and removed, for any rank >= 1 and any axis. Goldens are
# # numpy.take per slice; the kernel is a bit copy, so the comparison is zero-tolerance.
# # required_kernel_symbols skips every case on a checkout without the symbol.
operator: Unpack
name: unpack_float_rank1_axis0_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
comparison: {atol: 0.0, rtol: 0.0}
required_kernel_symbols: [arm_unpack_f32]
input_shape: [8]
axis: 0
