# # arm_dequantize_f16_f32 (ns-cmsis-nn#475) widens float16 to float32 bit-exactly: finite
# # values, subnormals, signed zeros and infinities convert exactly, so the golden is numpy's
# # astype and the comparison is zero-tolerance. A NaN follows its build path's rule (ns-cmsis-nn#719;
# # the f16_bits cases below pin it bit for bit).
# # The survey note above ("non-finite inputs are not possible for this operator") holds for
# # the S8/S16 kernels only; a float16 input carries every class, so the sweep applies here.
# # The runtime matches NaN by class, so the NaN lane asserts NaN-ness rather than the
# # payload. A case that touches FP16 runs on the f16 leg (the f32-only leg builds with
# # ARM_NN_ENABLE_F16 off). required_kernel_symbols skips every case on a checkout without
# # the symbol. Sizes straddle the 8-element MVE block with tails.
operator: Dequantize
name: dequantize_float_f16_widen_vec17_f32
suite: float
tensor_dtypes:
  input: FP16
  output: FP32
comparison: {atol: 0.0, rtol: 0.0}
required_kernel_symbols: [arm_dequantize_f16_f32]
input_shape: [1, 17]
hint: {call_style: per_tensor}
