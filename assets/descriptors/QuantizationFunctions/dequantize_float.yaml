name: dequantize_float_f16_bits_vec7_f32
entry: arm_dequantize_f16_bits_f32
suite: float
tensor_dtypes:
  input: FP16
  output: FP32
comparison: {atol: 0.0, rtol: 0.0}
input_shape: [1, 7]
hint: {call_style: per_tensor}
