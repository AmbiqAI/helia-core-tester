# Signed zeros. The uniform draw of the subnormal case above never lands on an exact
# zero, so the scalar widening helper's `mant == 0 -> return sign` branch went
# unexecuted. Half of float16's smallest subnormal is 2.98e-8, so a +/-1.5e-7 draw
# rounds a fifth of its lanes to +/-0.0 and leaves the rest on the four smallest
# subnormal magnitudes: both signs of zero and the subnormal path in one case.
