# arm_dequantize_f16_bits_f32 (ns-cmsis-nn#719) widens binary16 bit patterns without float16 support,
# so it runs on every float leg, including the f32-only ones. Finite values and infinities widen
# exactly; a NaN becomes the default NaN on the MVE vector conversion and keeps its sign and payload,
# made quiet, on the scalar conversion and the no-FPU integer widening. Every case ends on NaNs, so the
# MVE predicated tail and the FPU single-half tail meet the rule too. Each case carries both
# expectations and compares bits against the one its build compiled. The FP16-tagged cases run on
# the f16 legs; the U16-tagged ones (the same bit patterns as storage) on the f32 legs, cortex-m0's
# integer widening and cortex-m4's FPU among them.
# A signalling NaN, a negative quiet NaN, a payload NaN and +Inf in one four-half MVE block, then a
# three-half tail of NaNs.
