# Issue #74 phase 2c: non-finite inputs for the float SVDF.
#
# nonfinite_policy is mask. arm_svdf_f32 carries no non-finite note in
# Include/arm_nnfunctions_flt.h at all, and the arm_svdf_f16 note documents legs that
# disagree: the input-activation clamp propagates NaN on every build, but on MVE the
# output-activation clamp is vmaxnmq/vminnmq with no NaN restore, so a NaN resolves to
# a clamp bound there. A value that differs between the MVE and scalar legs is not a
# contract, so it is masked rather than pinned.
#
# One token per case at flat index 0 of the input sequence, which is step 0, batch row
# 0, feature 0. time_batches (3) exceeds sequence_steps (2), so the step-0 column is
# still in the state ring when the last step produces the output; the token therefore
# reaches batch row 0 of the output and batch row 1 stays fully asserted.
#
# The activation clamps are the descriptor default +/-1e30, so the reference resolves
# +/-Inf to the bound rather than propagating it. That is a further reason those lanes
# are don't-care: reachability is measured with finite probes, which the clamp does not
# swallow, so the mask is the same either way.
operator: SVDF
name: svdf_float_nonfinite_nan_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
input_shape: [2, 4]
input_mode: nonfinite_sweep
nonfinite_tokens: [nan]
nonfinite_policy: mask
hint:
  force_cmsis: true
  input_batches: 2
  input_height: 4
  feature_batches: 4
  time_batches: 3
  rank: 1
  sequence_steps: 2
  use_bias: true
# Exact ctx scratch sizes (issue #71), measured by calling the real, unmodified
# arm_svdf_f32_{input,output}_ctx_get_buffer_size() on host for this case's dims
# (input_batches=2, feature_batches=4, rank=1): not re-derived in Python.
expected_input_ctx_size: 32
expected_output_ctx_size: 32
---
