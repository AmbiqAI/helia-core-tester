# Float hard swish parity cases for arm_hard_swish_f32 / arm_hard_swish_f16
# (ns-cmsis-nn PR #413, contract from #410): status fn(input, output, size),
# computing x * min(max(x + 3, 0), 6) / 6 elementwise as
# x * clamp(fma(x, 1/6, 0.5), 0, 1), so x >= 3 returns x bit-exactly and
# x <= -3 returns exact zero; the f16 kernel evaluates in float32 and
# rounds once. Goldens use a float64 reference cast once to the output
# dtype; both saturated regions agree bit-exactly with the kernel by
# construction and the curved region sits well inside the repo's default
# float tolerances (measured max error 1.24e-7 f32 / 3.4e-4 f16 in #413).
#
# Inputs sample [-8, 8]. The default (128-element) cases exercise every
# region (zero, curved, identity); the tail cases exist to execute the
# tail-predicated epilogue, with sizes coprime to the MVE vector widths
# (4 f32 lanes, 8 f16 lanes) -- their few samples are not guaranteed to
# reach every region (e.g. the f32 tail draw never lands below -3).
#
# required_kernel_symbols gates each case on the target ns-cmsis-nn
# checkout declaring the kernel (per-symbol codegen probe), so one tester
# pin serves the #413 branch and checkouts without the kernels alike.
operator: HardSwishPrecise
name: hard_swish_float_default_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 4, 4, 8]
required_kernel_symbols: [arm_hard_swish_f32]
---
operator: HardSwishPrecise
name: hard_swish_float_tail_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 1, 1, 7]
required_kernel_symbols: [arm_hard_swish_f32]
---
operator: HardSwishPrecise
name: hard_swish_float_default_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_shape: [1, 4, 4, 8]
required_kernel_symbols: [arm_hard_swish_f16]
---
operator: HardSwishPrecise
name: hard_swish_float_tail_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_shape: [1, 1, 1, 13]
required_kernel_symbols: [arm_hard_swish_f16]
---
# Non-finite input cover for arm_hard_swish_f32 / _f16. The kernel evaluates
# x * clamp(x/6 + 0.5, 0, 1), so +Inf saturates the clamp to 1 and returns +Inf,
# while -Inf drives the clamp to 0 and yields -Inf * 0 = NaN. That NaN is an
# arithmetic consequence of the clamp form rather than a documented intent --
# #240 does not name the -Inf case -- so if the kernel ever grows an explicit
# -Inf arm these expectations have to be regenerated.
operator: HardSwishPrecise
name: hard_swish_float_nonfinite_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 4, 4, 8]
input_mode: nonfinite_sweep
required_kernel_symbols: [arm_hard_swish_f32]
---
operator: HardSwishPrecise
name: hard_swish_float_nonfinite_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_shape: [1, 4, 4, 8]
input_mode: nonfinite_sweep
required_kernel_symbols: [arm_hard_swish_f16]
