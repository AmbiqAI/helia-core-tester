operator: NNActivationFloat
name: nn_activation_float_tanh_nonfinite_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_shape: [1, 16]
input_mode: nonfinite_sweep
nonfinite_policy: strict
nonfinite_tokens: [inf, -inf]
# No NaN lane: the MVE tanh legs saturate with vminnmq, which is IEEE minNum and
# returns the numeric operand against a quiet NaN, so a NaN lane comes back as
# tanh(xmax) by design (arm_nn_activation_flt.h:89-93 for f32, :537-554 for f16).
# Every cortex-m55 leg is MVE, and neither IEEE propagation nor that divergence is
# a guarantee the header makes, so there is nothing here to assert.
activation_type: ARM_NN_FLT_ACT_TANH
act_param: 0.0
---
operator: NNActivationFloat
name: nn_activation_float_sigmoid_nonfinite_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_shape: [1, 16]
input_mode: nonfinite_sweep
nonfinite_policy: strict
nonfinite_tokens: [inf, -inf]
# No NaN lane: arm_nnsupportfunctions_flt.h:184-186 records sigmoid(NaN) == 1.0f as a
# "defined consequence" of exp(NaN) == exp(80) and states NaN is not a supported input
# to the softmax/sigmoid kernels. Locking a golden on an input the kernel disclaims
# would test the tester, not the contract.
activation_type: ARM_NN_FLT_ACT_SIGMOID
act_param: 0.0
