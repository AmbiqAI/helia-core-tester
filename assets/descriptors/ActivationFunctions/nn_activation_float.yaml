  input: FP32
  output: FP32
input_shape: [1, 65]
input_min: -8.0
input_max: 8.0
activation_type: ARM_NN_FLT_ACT_TANH
act_param: 0.0
# nn_activation_float_tanh_wide_f32 plus one sample: a partially-predicated
# final vector; see the header note on the _wide_tail_ variants.
---
# Dedicated cover for the LUT band that ns-cmsis-nn#303 added. Every sample
# lands in 4 <= |x| <= 6.5, including samples just past the |x| = 6
# saturation point, where the kernel correctly returns +/-1. Split into two
# single-signed cases because input_min / input_max describe one contiguous
# range and both saturation signs matter. The comparison is the policy
# default; the lutedge pair below carries the tightened one.
operator: NNActivationFloat
name: nn_activation_float_tanh_lutband_f32
suite: float
