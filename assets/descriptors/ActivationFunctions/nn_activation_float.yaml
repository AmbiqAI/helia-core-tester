name: nn_activation_float_sigmoid_nonfinite_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 16]
input_mode: nonfinite_sweep
nonfinite_policy: strict
nonfinite_tokens: [inf, -inf]
