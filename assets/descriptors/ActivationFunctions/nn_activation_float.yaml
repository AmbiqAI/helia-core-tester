name: nn_activation_float_tanh_lutedge_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 64]
input_min: 5.5
input_max: 5.98
activation_type: ARM_NN_FLT_ACT_TANH
act_param: 0.0
comparison:
  atol: 2.0e-6
  rtol: 0.0
---
