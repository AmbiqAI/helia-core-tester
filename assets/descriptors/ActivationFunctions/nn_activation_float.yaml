# Top-of-band cover. This pair stops below 6.0 so that NO sample saturates and
# every one is a genuine interpolation result. tanh is almost flat here, so the
# LUT itself is near-exact (interpolation error ~6e-8), which affords a
# comparison tightened below assert_close's defaults: atol 2e-6 with rtol 0
# (|expected| ~ 1 across the range, so any nonzero rtol would swamp an atol
# this small). It wins on every build (kernel_faithful.comparison_context): the
# shipped build's golden is the kernel's table arithmetic, every other build's
# the exact tanh, which the table interpolation and its few float32 roundings
# stay well inside. A sample that saturates early is off by
# 1 - tanh(x) >= 1 - tanh(5.98) ~ 1.3e-5, far outside 2e-6, so the pair detects
# any window that ends below its largest sample.
