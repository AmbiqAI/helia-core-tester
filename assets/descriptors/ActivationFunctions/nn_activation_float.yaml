# ---------------------------------------------------------------------------
# Non-finite input cases (input_mode: nonfinite_sweep).
#
# The leading flat elements of the input are overwritten with the tokens named
# by nonfinite_tokens; the rest keep their uniform draw, so each case is a
# mixed tensor. That mix is the point: a kernel that predicates a whole vector
# off on a NaN lane, or that corrupts the lanes neighbouring one, fails
# differently from a kernel that merely mishandles the token itself.
#
# The token set is per case because the contract is per kernel. Sources of
# record are ns-cmsis-nn Include/arm_nnfunctions_flt.h and
# Include/Internal/arm_nn_activation_flt.h, with issues AmbiqAI/ns-cmsis-nn#333
# and #382 for the propagation work and #314 for the tanh soft-float index.
#
# Two contracts are pinned here:
#   - Propagation: NaN in gives NaN out. arm_nnfunctions_flt.h:440-444 gives
#     this for the RELU, RELU6 and LEAKY_RELU legs only -- they classify NaN on
#     the integer bit pattern, so it holds on scalar and MVE at -Ofast. The
#     comparison macro treats both-NaN as equal (tester #75), so these lanes
#     assert identity, not tolerance.
#   - Clamping: where the kernel's domain reduction bounds a non-finite input
#     to a finite result -- tanh(+-Inf) = +-1, sigmoid(+Inf) = 1,
#     sigmoid(-Inf) = 0, relu6(+Inf) = 6, relu(-Inf) = 0 -- the expected value
#     is finite and the case's ordinary float comparison applies.
#
# Why cortex-m0 matters here: it is the only soft-float leg, so it is the only
# one where a float->int conversion inside a LUT index calculation goes through
# __aeabi_f2iz (which returns INT32_MAX for a quiet NaN) rather than
# VCVT.S32.F32 (which saturates NaN to 0). A NaN case that passes on m55/m4 can
# still read far out of bounds there.
#
# The regression guard for ns-cmsis-nn#314 is exactly one case,
# nn_activation_float_tanh_nan_softfloat_f32, and it runs on cortex-m0 only.
# #314 is NaN-only, so the +-Inf sweeps below do not reach it. The case requires
# the soft_float capability because that is the scope of the contract: the
# `#if !defined(__ARM_FP)` block at arm_nn_activation_flt.h:103-118 tests the
# input's bit pattern and returns the NaN quieted, and being an integer test it
# survives the shipped -Ofast build. Off soft-float there is nothing to assert.
# Hard-float scalar (cortex-m4) reaches the NaN only through the `ax != ax`
# cold branch at :123 onward, which -ffinite-math-only deletes -- :69-83 says so
# in as many words. MVE (every cortex-m55 leg) returns -0.9999877 by design,
# because vminnmq is IEEE minNum and the vnegq_m predicate fires on unordered
# lanes (:85-99). Both are documented as outside the contract, so both
# capability-skip rather than pin an observation.
#
# HARDSWISH has no case here at all: arm_nnfunctions_flt.h:445-451 puts the
# mux's hard swish outside the NaN/Inf contract and points callers who need it
# at arm_hard_swish_f32, so the standalone cases in hard_swish_float.yaml are
# where that kernel's non-finite behaviour is asserted.
operator: NNActivationFloat
name: nn_activation_float_tanh_nonfinite_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 16]
input_mode: nonfinite_sweep
nonfinite_policy: strict
nonfinite_tokens: [inf, -inf]
# No NaN lane: the MVE tanh legs saturate with vminnmq, which is IEEE minNum and
# returns the numeric operand against a quiet NaN, so a NaN lane comes back as
# tanh(xmax) by design (arm_nn_activation_flt.h:89-93 for f32, :537-554 for f16).
# Every cortex-m55 leg is MVE, and neither IEEE propagation nor that divergence is
# a guarantee the header makes, so there is nothing here to assert.
activation_type: ARM_NN_FLT_ACT_TANH
act_param: 0.0
---
operator: NNActivationFloat
name: nn_activation_float_tanh_nan_softfloat_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 16]
input_mode: nonfinite_sweep
nonfinite_policy: strict
nonfinite_tokens: [nan]
required_capabilities: [soft_float]
# The ns-cmsis-nn#314 guard; the block comment above says why it is the only NaN
# tanh lane in this file and why it is restricted to the soft-float leg. The
# expected value is NaN and the comparison macro treats both-NaN as equal (tester
# #75), so the lane asserts that a NaN came back rather than a particular payload
# -- arm_nn_activation_flt.h:115 quiets the input, and pinning the payload would
# mean modelling that.
activation_type: ARM_NN_FLT_ACT_TANH
act_param: 0.0
---
