operator: ResizeBilinear
name: resize_bilinear_aligned_odd_f16
suite: float
tensor_dtypes: {input: FP16, output: FP16}
# For all three interpolating FP16 cases, |input| <= 2 and the weights sum to 1.
# With u = 2^-11, rounding a weight, a product and up to three sums contributes
# at most 2*((1+u)^5-1). Rounding the FP32 reference to half adds at most 2*u.
comparison: {atol: 0.006, rtol: 0}
input_shape: [1, 9, 9, 21]
size: [17, 17]
align_corners: true
half_pixel_centers: false
