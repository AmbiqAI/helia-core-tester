# Issue #56: time_steps == 0 is a documented-legal streaming no-op
# (see arm_gru_unidirectional_f32.c: "a zero-length streaming chunk is a
# well-defined no-op") and currently has zero coverage. There is nothing
# to compare numerically (the input/output arrays are zero-length), so
# this case's job is solely to confirm the kernel returns
# ARM_CMSIS_NN_SUCCESS instead of rejecting a 0 time_steps call.
#
# Caveat verified by generation: a 0 time_steps case compiles to
# zero-length static arrays (`float32_t foo[] = { };`). That is a GNU C
# extension, not ISO C99/C11 -- accepted here because this repo's CMake
# build enables neither -pedantic-errors nor -Werror, but flag if that
# ever changes.
operator: GRUUnidirectional
name: gru_unidirectional_float_zero_time_steps_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
batch_size: 1
time_steps: 0
feature_size: 3
units: 4
time_major: false
reset_after: true
input_shape: [1, 0, 3]
hint:
  force_cmsis: true
---
