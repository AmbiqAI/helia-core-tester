# Issue #56: use_bias: false is a real Keras GRU configuration with zero
# coverage today -- every existing case always populates full bias arrays.
# The kernel is NULL-safe per-gate (`gate->input_bias ? gate->input_bias[h]
# : 0.0f` in arm_nn_gru_step_f32.c, same for hidden_bias, all three gates:
# update/reset/candidate), but that branch is dead code as far as this
# suite is concerned until now. The golden here is computed with the bias
# terms genuinely zeroed (mathematically identical to omitting them); the
# generator passes NULL bias pointers to the kernel rather than
# zero-valued arrays, so this actually exercises the guarded branch.
