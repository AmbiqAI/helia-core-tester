# Issue #56: buffers == NULL is legal when reset_after: true (the pre-reset
# formulation is the only thing that needs buffers->temp1 -- see
# arm_gru_unidirectional_f32.c:70 and arm_nn_gru_step_f32.c:130-139, both
# gated on `!reset_after`). No existing descriptor passes the whole
# `buffers` pointer as NULL -- the other fault cases only null individual
# fields of an otherwise-valid struct. expected_status is SUCCESS (the
# default): this is a legal-path regression guard, not an error-injection
# case, reusing the fault: mechanism's status-check plumbing.
operator: GRUUnidirectional
name: gru_unidirectional_float_null_buffers_reset_after_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
batch_size: 1
time_steps: 2
feature_size: 2
units: 2
time_major: false
reset_after: true
input_shape: [1, 2, 2]
fault: null_buffers
hint:
  force_cmsis: true
