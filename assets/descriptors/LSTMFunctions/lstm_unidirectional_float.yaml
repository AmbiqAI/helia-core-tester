# Issue #74 phase 2c: non-finite inputs for the unidirectional float LSTM.
#
# nonfinite_policy is mask. Include/arm_nnfunctions_flt.h carries no NaN/Inf note on
# arm_lstm_unidirectional_f32 or arm_lstm_unidirectional_f16 (the f16 block is a
# @copydoc of the f32 one), so nothing about a non-finite result is contracted and no
# output value may be pinned. The case asserts ARM_CMSIS_NN_SUCCESS, no fault and no
# hang, plus the case's float tolerance on every lane the token does not reach.
#
# One token per case at flat index 0, which is batch row 0 at t = 0. The recurrence
# carries whatever that produces into every later step of that row, so the mask covers
# row 0 and batch row 1 stays fully asserted -- which is what catches a vector leg that
# poisons a whole register rather than one lane. Weights, biases and the implicit zero
# initial states stay finite, so the swept element is the only non-finite operand.
#
# The gates swallow an infinity by saturating (sigmoid(+/-Inf) is 1 or 0, tanh(+/-Inf)
# is +/-1), so an Inf case has a finite reference. The mask is measured by reachability
# with finite probes, not by the finiteness of the reference, so it still covers row 0.
operator: LSTMUnidirectional
name: lstm_unidirectional_float_nonfinite_nan_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
batch_size: 2
time_steps: 3
feature_size: 4
units: 3
time_major: false
input_shape: [2, 3, 4]
input_mode: nonfinite_sweep
nonfinite_tokens: [nan]
nonfinite_policy: mask
hint:
  force_cmsis: true
---
