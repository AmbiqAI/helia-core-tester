# FullyConnected has no non-finite cover. arm_fully_connected_f32 and
# arm_fully_connected_f16 (Include/arm_nnfunctions_flt.h:753 and :1818, the f16 entry a
# @copydoc of the f32 one) say nothing about NaN or Inf, so the policy would have to be
# mask -- but every output element of a fully connected layer is a dot product over the
# whole input row, so one swept token reaches all of them and the mask covers 100% of
# the output. A case that masks every lane asserts nothing beyond SUCCESS and is
# rejected at generation time.
#
# A second input row would leave finite lanes, and the descriptors already accept a
# batch: fully_connected_float_vector8_f32 asks for input_shape [2, 16] and
# fully_connected_float_k64_n13_batch2_f32 for [2, 64]. The shared Keras-to-TFLite
# conversion drops the batch -- both generate input_dims.n = 1 over a single input
# row, so the batch2 case covers the K 64 row groups of the NT_T matmul and not a
# batch dimension -- and the batch cannot be reached from a descriptor alone. No
# case in this file exercises a batch. See AmbiqAI/helia-core-tester#106.
---
operator: FullyConnected
name: fully_connected_fault_filter_n_mismatch_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
  bias: FP32
input_shape: [1, 8]
filter_shape: [4, 8]
use_bias: true
fault: filter_n_mismatch
expected_status: ARM_CMSIS_NN_ARG_ERROR
