# Measured on the FVP: a 1024-term fp16 dot reaches 1.27x the FP16 default with the MVE lane
# accumulators and 7.3x (worst diff 1.4e-2 at |exp|=0.92) with the m55 f16 fallback leg's
# sequential scalar accumulation. 1.5e-2/1.5e-2 gives ~2x margin over the fallback floor; the
# f32 twin keeps the defaults.
