# Large-K row groups of the NT_T float matmul (ns-cmsis-nn#417): K >= 32 loads the lhs row once
# per four contiguous rhs rows. K 33 leaves a one-element predicated tail; N 5 leaves one
# remainder row for the single-row dot.
