  weights: FP32
input_1_shape: [1, 4, 8, 8]
input_2_shape: [1, 4, 8, 4]
adj_x: false
adj_y: false
input_mode: nonfinite_sweep
nonfinite_tokens: [inf]
nonfinite_policy: mask
