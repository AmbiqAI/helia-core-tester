# K 40 reaches the large-K row groups of the NT_T matmul from BatchMatMul (ns-cmsis-nn#417).
operator: BatchMatMul
name: batch_matmul_float_k40_n12_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
input_1_shape: [1, 3, 40]
input_2_shape: [1, 40, 12]
adj_x: false
adj_y: false
---
operator: BatchMatMul
name: batch_matmul_float_k40_n12_f16
suite: float
activation_dtype: FP16
weight_dtype: FP16
tensor_dtypes:
  input: FP16
  output: FP16
  weights: FP16
input_1_shape: [1, 3, 40]
input_2_shape: [1, 40, 12]
adj_x: false
adj_y: false
# Measured on the FVP at the shipped flags: the K 40 row groups accumulate in fp16 lanes and
# reach 2.27x the FP16 default (worst diff 2.4e-3 at |exp|=0.08). 4e-3/4e-3 gives ~1.8x margin.
comparison:
  atol: 0.004
  rtol: 0.004
---
# Non-finite cover for the float batch matmul kernels. arm_batch_matmul_f32 and
# arm_batch_matmul_f16 (Include/arm_nnfunctions_flt.h:918 and :1952, the f16 entry a
# @copydoc of the f32 one) say nothing about NaN or Inf, so nonfinite_policy is mask:
# the output row that consumed the token is don't-care, and the case asserts SUCCESS,
# no fault, no hang and exact values everywhere else.
#
# The sweep applies to the LHS only, so the RHS stays finite and every poisoned element
# is a single-token propagation rather than a mix. The token sits in row 0 of the first
# of four batch matrices, so it poisons one of 32 output rows: 4 of 128 output elements
# are masked and 96.9% stay asserted strictly. The other three batch matrices are what
# catch a leg that lets the token escape its own matrix.
#
# One token per case, because each output element is a dot product over K: all three
# tokens would share one row and the golden would be about (+Inf) + (-Inf).
---
operator: BatchMatMul
name: batch_matmul_float_nonfinite_nan_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
tensor_dtypes:
  input: FP32
  output: FP32
  weights: FP32
input_1_shape: [1, 4, 8, 8]
input_2_shape: [1, 4, 8, 4]
adj_x: false
adj_y: false
input_mode: nonfinite_sweep
nonfinite_tokens: [nan]
nonfinite_policy: mask
---
operator: BatchMatMul
name: batch_matmul_float_nonfinite_inf_f32
suite: float
activation_dtype: FP32
weight_dtype: FP32
