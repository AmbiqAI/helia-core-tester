# Canonical rank4 standalone cases; exact S32 indices, no hardware-stream claim.
# First NaN wins by CORE policy (not universal LiteRT parity); otherwise first
# numeric extremum, including signed-zero ties. Native LiteRT FP16 is unsupported.
# Finite cases place distinct boundary/interior winner indices across batches.
operator: ArgMax
name: argmax_first_f32
suite: float
required_kernel_symbols: [arm_argmax_f32]
tensor_dtypes:
  input: FP32
  output: S32
input_shape: [3, 1, 1, 9]
axis: 0
