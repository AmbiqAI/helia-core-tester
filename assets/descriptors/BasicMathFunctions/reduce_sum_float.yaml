---
# Non-finite cover for the float ReduceSum kernels. The arm_reduce_sum_f32 and
# arm_nn_mean_f32 doxygen blocks in ns-cmsis-nn Include/arm_nnfunctions_flt.h both
# state "NaN and Inf propagate" (the f16 entries @copydoc them), so these lanes are
# strict.
#
# One token per case for the strict cases, deliberately. A reduction folds a whole
# group into one output element, so a case carrying both +Inf and -Inf would put them
# in the same group and the golden would be NaN from the (+Inf) + (-Inf) alone -- a
# result about IEEE addition, not about the kernel. With one token the swept group's
# expected value is the token itself and every other group stays finite and fully
# asserted. The two-token pair at the end of this file is the deliberate exception and
# masks that one group instead of pinning it.
#
# The same header warns that the float32 accumulator can itself saturate to +/-Inf
# depending on accumulation order, and that vector and scalar builds may disagree
# when it does. These inputs are drawn from [-1, 1) in groups of 5, so no
# accumulation order can overflow and the only non-finite output is the token's.
operator: ReduceSum
name: reduce_sum_float_nonfinite_nan_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 3, 4, 5]
axes: [3]
input_mode: nonfinite_sweep
nonfinite_policy: strict
nonfinite_tokens: [nan]
---
