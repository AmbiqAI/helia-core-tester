---
# Bounded spatial reduction that keeps the non-reduced spatial extent (#131). These are the
# shapes ns-cmsis-nn#484 is about, and since that work landed they take its channel-preserving
# spatial path: the kernel selects it when the batch and channel axes are retained, a spatial
# axis is reduced, and the output dims agree. They were written before that path existed, when
# the same shapes fell to the generic nested loop, so read them as shape cover for the spatial
# route rather than for the generic one. Generic-route cover is the mixed-axis pair further
# down, which reduces a spatial axis together with the channel axis and so fails that guard.
#
# The first case is the shape the runtime actually hands the kernel for the reported workload:
# heliaRT pads a rank-3 model shape at the end, so a sequence reduction arrives as
# [1, 64, 128, 1] reducing h, not as a width reduction. The width cases that follow are the
# same arithmetic in the other memory layout, kept as controls, because a route guard written
# for one axis will not fire for the other. That distinction is why this family records the
# model shape alongside the kernel arguments rather than the model shape alone.
#
# Goldens come from the family's numpy reference, an independent implementation but not an
# independent accumulation order: reducing a non-innermost axis, numpy sums in the same
# sequential order a scalar loop does.
#
# Model [1, 64, 128] reducing the sequence axis, as the runtime pads and passes it:
# kernel input [1, 64, 128, 1], axes [0, 1, 0, 0], output [1, 1, 128, 1].
operator: ReduceSum
name: reduce_sum_float_axis_h_adapter_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 64, 128, 1]
axes: [1]
keepdims: false
---
# The same layout in half precision at a retained extent that is not a whole number of half
# vectors, small because the geometry rather than the volume is what is being covered. The
# kernel accumulates in float32 and rounds once, which is what the reference does.
operator: ReduceSum
name: reduce_sum_float_axis_h_adapter_tail_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_shape: [1, 8, 127, 1]
axes: [1]
---
# Equivalent-layout control: the same arithmetic with the retained extent in channels instead
# of width. Not the memory layout the runtime hands the kernel for the reported workload.
operator: ReduceSum
name: reduce_sum_float_axis_w_c128_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 1, 64, 128]
axes: [2]
# Mirrors the reported model, which drops the reduced axis. The harness dims and the golden are
# the same either way; only the emitted model's output rank changes.
keepdims: false
---
# Three retained rows, so the reduction runs with a varying row index rather than the degenerate
# single-row case the reported shape happens to be. Thirty-three retained channels is eight whole
# float32 vectors and a remainder. This also takes the spatial path since #484.
operator: ReduceSum
name: reduce_sum_float_axis_w_rows_tail_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 3, 8, 33]
axes: [2]
---
# The float16 twin of the case above rather than of the reported shape: the half-precision
# kernel is a separate translation unit taking the same route, so the dtype coverage is the same
# at a ninth of the payload the reported shape would have cost in half precision. It accumulates
# in float32 and rounds once, which is what the reference does.
operator: ReduceSum
name: reduce_sum_float_axis_w_rows_tail_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_shape: [1, 3, 8, 33]
axes: [2]
---
# Mixed spatial-and-channel reduction (ns-cmsis-nn#488). Reducing h together with c fails the
# kernel's spatial guard, which requires the channel axis to be retained, and the union of the
# axis mask with the size-one dimensions leaves no contiguous suffix, so neither the spatial
# path nor the flatten helper claims it and the generic traversal runs. Every other case in
# this family now reaches one of the two faster routes, so without these the generic body is
# never executed.
operator: ReduceSum
name: reduce_sum_float_axis_hc_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 3, 4, 5]
axes: [1, 3]
