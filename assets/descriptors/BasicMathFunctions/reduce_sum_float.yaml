---
# The token placement AmbiqAI/ns-cmsis-nn#429 runs on, as closely as the generator
# expresses it. #429's mean_f16_nan_inf reduces the innermost axis of a {1,1,2,3}
# input holding {1, +Inf, 2, NaN, 1, 2}: the reduced groups are three elements long
# and each token sits alone in a group, +Inf in group 0 and NaN in group 1, which the
# flat 0..k-1 rule cannot express -- hence nonfinite_positions. The shape here is four
# groups of three rather than two, because a case whose every output lane is masked
# does not generate, so two of the four output lanes stay finite and asserted.
# Both token groups reduce to a non-finite reference, so the policy is mask.
operator: ReduceSum
name: reduce_sum_float_nonfinite_issue429_flatten_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 1, 4, 3]
axes: [3]
input_mode: nonfinite_sweep
nonfinite_policy: mask
nonfinite_tokens: [inf, nan]
nonfinite_positions: [1, 3]
---
operator: ReduceSum
name: reduce_sum_float_nonfinite_issue429_flatten_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_shape: [1, 1, 4, 3]
axes: [3]
input_mode: nonfinite_sweep
nonfinite_policy: mask
nonfinite_tokens: [inf, nan]
nonfinite_positions: [1, 3]
---
# The same pairing on the reduced axis #429's mean_f16_generic_nan_inf uses: a
# {1,2,2,2} input holding {NaN, 1, 2, 3, 4, 5, 6, +Inf} reduced over H, so the
# reduced axis is not the innermost one and the kernel does not take its flatten
# path. Shape, axis and both token positions match that case; NaN reaches output
# lane 0 and +Inf lane 3, and the two clean lanes stay asserted.
operator: ReduceSum
name: reduce_sum_float_nonfinite_issue429_generic_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 2, 2, 2]
axes: [1]
input_mode: nonfinite_sweep
nonfinite_policy: mask
nonfinite_tokens: [nan, inf]
nonfinite_positions: [0, 7]
---
