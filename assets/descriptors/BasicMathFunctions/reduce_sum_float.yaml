# +Inf and -Inf inside ONE reduction group. The single-token cases above cannot
# produce it, because a group needs both infinities before the fold can reach
# Inf + (-Inf). Group 0 (the leading five elements of the last axis) therefore holds
# both tokens and its reference is NaN, so this pair is one of the places the
# reduction descriptors use nonfinite_policy: mask -- NaN is what IEEE addition
# gives, not something the header contracts about the kernel's fold order. The other
# eleven groups stay finite and fully asserted, and the case asserts SUCCESS and no
# timeout.
#
# This is adjacent to AmbiqAI/ns-cmsis-nn#429 rather than its input. #429's two
# cases put one token per group; the *_nonfinite_issue429_* cases below carry that
# placement.
operator: ReduceSum
name: reduce_sum_float_nonfinite_two_token_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 3, 4, 5]
axes: [3]
input_mode: nonfinite_sweep
nonfinite_policy: mask
nonfinite_tokens: [inf, -inf]
---
