# Non-finite cover for the float sub kernels, against the same contract the add and
# mul cases cite: ns-cmsis-nn Include/arm_nnfunctions_flt.h:534-548 (issues
# AmbiqAI/ns-cmsis-nn#333 and #382) documents NaN propagating through the clamp at
# every optimization level including the shipped -Ofast, and infinities clamping to
# the activation bounds -- or passing through unchanged under the +/-INFINITY "no
# clamp" idiom.
#
# Only the left operand carries the sweep; the right stays finite, so each lane is a
# single-token check rather than a mix whose result would not say which operand drove
# it. Lanes 0..2 are NaN, +Inf, -Inf.
#
# The clamped variants leave act_min/act_max at their +-1e30 default, so f32 expects
# +-1e30 on the Inf lanes; in f16 that bound is itself Inf once narrowed, so the f16
# case reads as passthrough. The _noclamp_f32 variant asserts Inf passthrough on its
# own terms rather than as an f16 range artifact.
operator: Sub
name: sub_float_nonfinite_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_1_shape: [1, 4, 4, 8]
input_2_shape: [1, 4, 4, 8]
input_mode: nonfinite_sweep
---
operator: Sub
name: sub_float_nonfinite_f32
