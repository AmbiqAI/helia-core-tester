# Non-finite cover for the float sub kernels, against the contract in sub's own
# doxygen block: the arm_elementwise_sub_f32/f16 entries in ns-cmsis-nn
# Include/arm_nnfunctions_flt.h (issues AmbiqAI/ns-cmsis-nn#333 and #382) document
# NaN, including the Inf - Inf the arithmetic makes itself, propagating through the
# clamp at every optimization level including the shipped -Ofast, and infinities
# clamping to the activation bounds -- or passing through unchanged under the
# +/-INFINITY "no clamp" idiom.
#
# Only the left operand carries the sweep; the right stays finite, so each lane is a
# single-token check rather than a mix whose result would not say which operand drove
# it. Lanes 0..2 are NaN, +Inf, -Inf.
#
# The clamped variants leave act_min/act_max at their +-1e30 default, so f32 expects
# +-1e30 on the Inf lanes; in f16 that bound is itself Inf once narrowed, so the f16
# case reads as passthrough. The _noclamp_f32 variant asserts Inf passthrough on its
# own terms rather than as an f16 range artifact.
operator: Sub
name: sub_float_nonfinite_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_1_shape: [1, 4, 4, 8]
input_2_shape: [1, 4, 4, 8]
input_mode: nonfinite_sweep
nonfinite_policy: strict
---
operator: Sub
name: sub_float_nonfinite_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_1_shape: [1, 4, 4, 8]
input_2_shape: [1, 4, 4, 8]
input_mode: nonfinite_sweep
nonfinite_policy: strict
---
operator: Sub
name: sub_float_nonfinite_noclamp_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_1_shape: [1, 4, 4, 8]
input_2_shape: [1, 4, 4, 8]
input_mode: nonfinite_sweep
nonfinite_policy: strict
# MIN/MAX against +-INFINITY is the identity, so +Inf - finite stays +Inf instead of
# landing on the 1e30 default bound.
act_min: -.inf
act_max: .inf
