operator: Add
name: add_float_nonfinite_clamped_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_1_shape: [1, 4, 4, 8]
input_2_shape: [1, 4, 4, 8]
input_mode: nonfinite_sweep
nonfinite_policy: strict
# Finite in f16, unlike the +-1e30 default, so the swept infinities actually reach
# the clamp instead of being compared against a bound that narrowed to Inf.
act_min: -6.0
act_max: 6.0
---
operator: Add
name: add_float_nonfinite_noclamp_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_1_shape: [1, 4, 4, 8]
input_2_shape: [1, 4, 4, 8]
input_mode: nonfinite_sweep
nonfinite_policy: strict
# The documented "no clamp" idiom: MIN/MAX against +-INFINITY is the identity, so
# +Inf + finite stays +Inf instead of landing on the 1e30 default bound.
act_min: -.inf
act_max: .inf
