# Broadcast shapes for the dims-taking float entry point
# arm_elementwise_add_broadcast_{f32,f16} (ns-cmsis-nn#415): NumPy/TFLite NHWC
# broadcasting, same clamp and NaN contract as the flat arm_elementwise_add_{f32,f16}.
# `hint: call_style: broadcast` selects that entry point; the golden is NumPy's
# broadcast of the operands as drawn (no materialised copy in the input arrays).
# input_2 broadcast along N, H and W (the vec-op-scalar leaf per channel run)
operator: Add
name: add_float_bcast_channel_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_1_shape: [1, 2, 3, 4]
input_2_shape: [1, 1, 1, 4]
hint:
  call_style: broadcast
required_kernel_symbols: [arm_elementwise_add_broadcast_f32]

