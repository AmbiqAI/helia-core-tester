operator: Add
name: add_float_nonfinite_noclamp_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_1_shape: [1, 4, 4, 8]
input_2_shape: [1, 4, 4, 8]
input_mode: nonfinite_sweep
# The documented "no clamp" idiom: MIN/MAX against +-INFINITY is the identity, so
# +Inf + finite stays +Inf instead of landing on the 1e30 default bound.
act_min: -.inf
act_max: .inf
