# Float squared difference: arm_elementwise_squared_difference_f16
# (AmbiqAI/ns-cmsis-nn#490). The kernel is flat -- two equal-length operands,
# one output, a block_size, no dims, no broadcast, no activation clamp -- and
# has two legs: a tail-predicated MVE loop of 8 halves per iteration
# (ARM_MATH_MVE_FLOAT16 without ARM_MATH_AUTOVECTORIZE) and a scalar
# `_Float16` loop, both behind one argument guard that returns
# ARM_CMSIS_NN_ARG_ERROR for any NULL pointer or a block_size below 1.
#
# Every case names the symbol in required_kernel_symbols so a checkout without
# ns-cmsis-nn#490 skips this file cleanly instead of failing the build.
#
# Block sizes are chosen against the 8-lane MVE loop: 1 and 7 run only a
# predicated partial vector, 8 and 16 run only full vectors with no
# predication, 9 and 15 run one full vector and a tail, 45 and 128 are the
# odd-block and default shapes the sibling sub_float cases use, and 512 is a
# longer run. Pinned-operand cases carry exact binary16 values chosen for the
# rounding, overflow and underflow boundaries of the two IEEE operations the
# kernel performs; their golden is the same IEEE model the generator uses for
# every case (one correctly rounded binary16 result per operation), so they
# compare bit for bit (`bit_exact`), which also pins the sign of zero that a
# tolerance comparison cannot see. Random-draw cases keep the FP16 default
# tolerance the rest of the float suite uses.
operator: SquaredDifference
name: squared_difference_float_default_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_1_shape: [1, 4, 4, 8]
input_2_shape: [1, 4, 4, 8]
required_kernel_symbols: [arm_elementwise_squared_difference_f16]
---
# block_size 1: the MVE loop runs one iteration with a single active lane.
operator: SquaredDifference
name: squared_difference_float_single_f16
suite: float
tensor_dtypes:
  input: FP16
  output: FP16
input_1_shape: [1, 1, 1, 1]
input_2_shape: [1, 1, 1, 1]
required_kernel_symbols: [arm_elementwise_squared_difference_f16]
