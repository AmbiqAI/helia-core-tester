---
# Non-finite cover for the float pad kernels. Pad is pure data movement: it copies
# input elements and writes pad_value everywhere else, so bit-exact pass-through of
# NaN, +Inf and -Inf is the only correct behaviour and the policy is strict. There is
# no non-finite note to cite in arm_nnfunctions_flt.h because a copy has nothing to
# specify -- the assertion here is that the copy really is a copy and that no lane
# around the tokens is disturbed.
operator: Pad
name: pad_float_nonfinite_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 3, 3, 2]
paddings:
  - [0, 0]
  - [1, 1]
  - [1, 1]
  - [0, 0]
pad_value: 0.25
input_mode: nonfinite_sweep
