# Non-finite cover for the float avg_pool kernels. The arm_avg_pool_f16 doxygen block
# in ns-cmsis-nn Include/arm_nnfunctions_flt.h documents the two build legs
# separately: on non-MVE a NaN in the window propagates through the window sum and
# the bit-classified scalar clamp to the output at every optimization level, while
# the MVE clamp is vmaxnmq/vminnmq with no NaN restore, so the same NaN resolves to a
# clamp bound there. Which leg a case runs is a build property, not a contract, so
# nonfinite_policy is mask: the pooling windows that see a token are don't-care and
# the case asserts SUCCESS, no fault, no hang, and correct values in every window the
# token does not reach.
#
# One token per case, because a pooling window is a reduction group: with all three
# tokens in the same window the golden would be a statement about how averaging
# combines +Inf with -Inf, not about the kernel.
operator: AvgPool
name: avg_pool_float_nonfinite_nan_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 6, 6, 3]
pool_size: [2, 2]
strides: [2, 2]
padding: SAME
input_mode: nonfinite_sweep
nonfinite_tokens: [nan]
nonfinite_policy: mask
---
