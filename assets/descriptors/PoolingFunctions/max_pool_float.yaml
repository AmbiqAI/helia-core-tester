# Edge cover: an odd input extent with SAME padding, so the last row and column of
# windows are only partly inside the tensor. nonfinite_positions puts the NaN at
# (h=4, w=4, c=0), flat index 72, which is the single real element of the bottom-right
# window; the cases above all place their token in a fully covered window. What the
# padded leg does with a window that is one element and a token is not something the
# arm_max_pool_f16 note covers either, so the policy stays mask.
operator: MaxPool
name: max_pool_float_nonfinite_nan_same_odd_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 5, 5, 3]
pool_size: [2, 2]
strides: [2, 2]
padding: SAME
input_mode: nonfinite_sweep
nonfinite_tokens: [nan]
nonfinite_positions: [72]
nonfinite_policy: mask
