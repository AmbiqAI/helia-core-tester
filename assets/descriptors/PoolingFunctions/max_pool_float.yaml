---
# Non-finite cover for the float max_pool kernels. The arm_max_pool_f16 doxygen block
# in ns-cmsis-nn Include/arm_nnfunctions_flt.h does document the kernel, and what it
# documents is why the policy is mask rather than strict: the scalar reduction's
# ordered compare drops a NaN window element and its NaN behaviour at the shipped
# -Ofast is unspecified, the MVE leg's vmaxnmq reduction and vmaxnmq/vminnmq clamp
# suppress NaN, and the note ends by declining to promise NaN propagation end to end.
# The two legs disagree and neither answer is contracted, so the pooling windows that
# see a token are don't-care and the case asserts SUCCESS, no fault, no hang, and
# correct values in every window the token does not reach.
#
# One token per case, because a pooling window is a reduction group: with all three
# tokens in the same window the golden would be a statement about how the maximum
# combines +Inf with -Inf, not about the kernel.
#
# The NaN case is worth reading carefully. TensorFlow Lite's reference max pool folds
# with std::max, which returns its first argument when either is NaN, so the golden
# depends on where in the window the NaN falls; the kernel's own MVE leg uses VMAXNM
# (IEEE maxNum), which suppresses NaN and returns the numeric operand. The two need
# not agree, which is exactly why the affected window is masked instead of pinned.
#
# The -Inf case is the same problem with a finite reference: max(-Inf, x) is just x,
# so nothing in the golden looks non-finite, yet which value the kernel writes there
# still depends on a fold order the header does not specify. The mask covers every
# lane a token can reach, not only the lanes where the reference went non-finite.
operator: MaxPool
name: max_pool_float_nonfinite_nan_f32
suite: float
tensor_dtypes:
  input: FP32
  output: FP32
input_shape: [1, 6, 6, 3]
pool_size: [2, 2]
strides: [2, 2]
padding: VALID
input_mode: nonfinite_sweep
nonfinite_tokens: [nan]
nonfinite_policy: mask
---
