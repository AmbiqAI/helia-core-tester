# Shared kernel-id registry for the hardware bridge.
#
# This is the single source of truth mapping a bridged (family, operator, dtype[, weight_dtype])
# tuple to the numeric `kernel_id` sent over HCTP in CASE_META and dispatched by firmware in
# `cmake/hardware/benchmark_server_adapters.gen.c`'s `hct_run_kernel_once()`. Each row also
# names the firmware's `c_define` for that id; `scripts/generate_kernel_catalog.py` renders the
# `HCT_KERNEL_ID_*` block of `cmake/hardware/benchmark_server_adapters.h` (and the kernel
# catalog) from this file, and `helia_core_tester/tests/test_kernel_registry.py` checks that
# the committed header, the catalog, and this file agree. When an ns-cmsis-nn checkout ships a
# kernel contract export, every `cmsis_function` must be declared in it.
#
# When adding a new bridged kernel:
#   1. Reserve the next kernel_id here, with its `c_define` and `cmsis_function`.
#   2. Run `python3 scripts/generate_kernel_catalog.py` to regenerate the header block and
#      the catalog.
#   3. Add a FirmwareAdapterSpec in helia_core_tester/hardware/adapter_specs.py and run
#      `python3 scripts/generate_hardware_adapters.py`.
#   4. Add a builder function in generated_test_bridge.py's `_BUILDERS` dispatch table.

