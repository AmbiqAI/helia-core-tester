# Campaign for `helia_core_tester agent-loop init`.
name: dw-s16
board: apollo510_evb
# bench-agent board id; defaults to board.
bench_id: apollo510_evb
legs: [tcm, mram]
target:
  op: DepthwiseConv
  dtype: S16
  # Optional: only these case ids.
  case_ids: []
kernels:
  repo: ~/ns-cmsis-nn
  ref: v7.40.0
# Charged board evals for the agent.
evals: 12
# Claude --max-budget-usd.
cost_usd: 25
model: claude-opus-5-5
# Random s16 shapes, 0 for none.
hidden_shapes: 12
repeats: 3
# Outside the workspace; init makes it 0700.
secrets_dir: ~/hct-secrets/dw-s16
# Optional: seed the agent tree from a ledger diff.
# start_patch: ~/campaigns/dw-s16-run1/ledger/009.diff
# start_notes: |
#   - The fast path is vectorized; the generic path is not.
