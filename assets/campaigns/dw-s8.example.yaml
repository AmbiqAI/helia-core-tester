# Campaign for `helia_core_tester agent-loop init`.
name: dw-s8
board: apollo510_evb
# bench-agent board id; defaults to board.
bench_id: apollo510_evb
legs: [tcm, mram]
target:
  op: DepthwiseConv
  dtype: S8
  # Optional: only these case ids.
  case_ids: []
kernels:
  repo: ~/ns-cmsis-nn
  ref: v7.43.0
# Charged board evals for the agent.
evals: 12
# Last evals for cutting code size; 0 for none.
# size_evals: 4
# Claude --max-budget-usd.
cost_usd: 25
model: claude-opus-5-5
# Random s8 shapes per op, 0 for none.
hidden_shapes: 12
repeats: 3
# Outside the workspace; init makes it 0700.
secrets_dir: ~/hct-secrets/dw-s8
# Optional: seed the agent tree from a ledger diff.
# start_patch: ~/campaigns/dw-s8-run1/ledger/009.diff
# start_notes: |
#   - The generic path is vectorized; the _opt paths are not.
