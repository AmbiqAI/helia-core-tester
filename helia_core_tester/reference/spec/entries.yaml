# Single source of truth for the hct_ref C ABI.
#
# `python -m helia_core_tester.generation.reference.abi --write` renders
# include/hct_ref_abi.h from this file; the Python bindings build their ctypes
# structs from it at import. tests/test_reference_abi.py fails on a stale header.
#
# Every kernel entry has one signature:
#   int32_t hct_ref_<entry>(const <params> *params,
#                           const HctTensor *inputs, int32_t num_inputs,
#                           HctTensor *outputs, int32_t num_outputs);
# Every prepare entry has one signature:
#   int32_t hct_ref_<entry>(const <in> *in, <out> *out);
#
# Field types: int32, int64, float32, float64. Tensor dtypes: int8, int16, int32,
# int64, float32, float16 (binary16 bits in uint16 storage), bool (uint8).

abi_version: 1
max_rank: 8

dtypes:
  int8: 1
  int16: 2
  int32: 3
  int64: 4
  float32: 5
  float16: 6
  bool: 7

status:
  OK: 0
  E_NULL: 1      # a NULL params/tensor/data pointer
  E_COUNT: 2     # wrong number of input or output tensors
  E_DTYPE: 3     # a tensor dtype the entry does not take
  E_SHAPE: 4     # rank or dims invalid, or inconsistent with the other tensors
  E_PARAM: 5     # a parameter out of its valid range
  E_SIZE: 6      # element count above HCT_MAX_ELEMENTS

comparisons:
  EQUAL: 0
  NOT_EQUAL: 1
  GREATER: 2
  GREATER_EQUAL: 3
  LESS: 4
  LESS_EQUAL: 5

activations:
  NONE: 0
  RELU: 1
  RELU6: 2
  RELU_N1_TO_1: 3

# arm_nn_activation_f32/f16 types (ARM_NN_FLT_ACT_*).
float_activations:
  NONE: 0
  RELU: 1
  RELU6: 2
  LEAKY_RELU: 3
  SIGMOID: 4
  TANH: 5
  HARDSWISH: 6

structs:
  HctQuantizeMultiplierIn:
    doc: A real multiplier, as TFLite's QuantizeMultiplier takes it.
    fields:
      - [real_multiplier, float64]
  HctQuantizeMultiplierOut:
    fields:
      - [multiplier, int32]
      - [shift, int32]

  HctActivationRangeIn:
    doc: CalculateActivationRangeQuantized. activation is an HctActivation value.
    fields:
      - [activation, int32]
      - [dtype, int32]
      - [scale, float32]
      - [zero_point, int32]
  HctActivationRangeOut:
    fields:
      - [min, int32]
      - [max, int32]

  HctAddQuant:
    doc: Per-tensor quantization of an int8/int16 Add, scales as float32 as TFLite stores them.
    fields:
      - [dtype, int32]
      - [activation, int32]
      - [input1_scale, float32]
      - [input1_zero_point, int32]
      - [input2_scale, float32]
      - [input2_zero_point, int32]
      - [output_scale, float32]
      - [output_zero_point, int32]
  HctAddParams:
    doc: Offsets follow CMSIS-NN; input offsets are -zero_point, output offset is +zero_point.
    fields:
      - [left_shift, int32]
      - [input1_offset, int32]
      - [input1_multiplier, int32]
      - [input1_shift, int32]
      - [input2_offset, int32]
      - [input2_multiplier, int32]
      - [input2_shift, int32]
      - [output_offset, int32]
      - [output_multiplier, int32]
      - [output_shift, int32]
      - [activation_min, int32]
      - [activation_max, int32]
  HctFloatActivationParams:
    doc: Float clamp; +/-INFINITY leaves the side unbounded.
    fields:
      - [activation_min, float32]
      - [activation_max, float32]
  HctNoParams:
    doc: Entries that take no parameters; the field is ignored.
    fields:
      - [unused, int32]
  HctMulQuant:
    fields:
      - [dtype, int32]
      - [activation, int32]
      - [input1_scale, float32]
      - [input1_zero_point, int32]
      - [input2_scale, float32]
      - [input2_zero_point, int32]
      - [output_scale, float32]
      - [output_zero_point, int32]
  HctMulParams:
    fields:
      - [input1_offset, int32]
      - [input2_offset, int32]
      - [output_offset, int32]
      - [output_multiplier, int32]
      - [output_shift, int32]
      - [activation_min, int32]
      - [activation_max, int32]
  HctSquaredDifferenceParams:
    doc: As HctAddParams; left_shift is 7 (int8) or 0 (int16) and the output multiplier is general.
    fields:
      - [left_shift, int32]
      - [input1_offset, int32]
      - [input1_multiplier, int32]
      - [input1_shift, int32]
      - [input2_offset, int32]
      - [input2_multiplier, int32]
      - [input2_shift, int32]
      - [output_offset, int32]
      - [output_multiplier, int32]
      - [output_shift, int32]
      - [activation_min, int32]
      - [activation_max, int32]
  HctComparisonQuant:
    doc: operation is an HctComparison value.
    fields:
      - [dtype, int32]
      - [operation, int32]
      - [input1_scale, float32]
      - [input1_zero_point, int32]
      - [input2_scale, float32]
      - [input2_zero_point, int32]
  HctComparisonParams:
    fields:
      - [operation, int32]
      - [left_shift, int32]
      - [input1_offset, int32]
      - [input1_multiplier, int32]
      - [input1_shift, int32]
      - [input2_offset, int32]
      - [input2_multiplier, int32]
      - [input2_shift, int32]
  HctAbsQuant:
    fields:
      - [dtype, int32]
      - [input_scale, float32]
      - [input_zero_point, int32]
      - [output_scale, float32]
      - [output_zero_point, int32]
  HctAbsParams:
    doc: TFLite's Abs; input_zero_point is subtracted, the result rescaled only when needs_rescale.
    fields:
      - [input_zero_point, int32]
      - [output_zero_point, int32]
      - [needs_rescale, int32]
      - [multiplier, int32]
      - [shift, int32]
  HctClampParams:
    fields:
      - [activation_min, int32]
      - [activation_max, int32]
  HctReluQuant:
    doc: Relu and Relu6 (TFLM CalculateReluOpData); act_max is +INFINITY for Relu, 6 for Relu6.
    fields:
      - [dtype, int32]
      - [input_scale, float32]
      - [input_zero_point, int32]
      - [output_scale, float32]
      - [output_zero_point, int32]
      - [act_max, float32]
  HctReluParams:
    doc: input_offset/output_offset are the zero points, as TFLite's ReluQuantized takes them.
    fields:
      - [input_offset, int32]
      - [output_offset, int32]
      - [output_multiplier, int32]
      - [output_shift, int32]
      - [activation_min, int32]
      - [activation_max, int32]
  HctLeakyReluQuant:
    fields:
      - [dtype, int32]
      - [alpha, float32]
      - [input_scale, float32]
      - [input_zero_point, int32]
      - [output_scale, float32]
      - [output_zero_point, int32]
  HctPreluQuant:
    fields:
      - [dtype, int32]
      - [input_scale, float32]
      - [input_zero_point, int32]
      - [alpha_scale, float32]
      - [alpha_zero_point, int32]
      - [output_scale, float32]
      - [output_zero_point, int32]
  HctPreluParams:
    doc: TFLite's BroadcastPrelu4D; input/alpha offsets are -zero_point, output offset +zero_point.
    fields:
      - [input_offset, int32]
      - [alpha_offset, int32]
      - [output_offset, int32]
      - [identity_multiplier, int32]
      - [identity_shift, int32]
      - [alpha_multiplier, int32]
      - [alpha_shift, int32]
  HctLeakyReluParams:
    doc: TFLite's QuantizeLeakyRelu; offsets are the zero points.
    fields:
      - [input_offset, int32]
      - [output_offset, int32]
      - [alpha_multiplier, int32]
      - [alpha_shift, int32]
      - [identity_multiplier, int32]
      - [identity_shift, int32]

  HctHardSwishQuant:
    fields:
      - [dtype, int32]
      - [input_scale, float32]
      - [input_zero_point, int32]
      - [output_scale, float32]
      - [output_zero_point, int32]
  HctHardSwishParams:
    doc: TFLite's HardSwishParams (int8); Q15 multipliers with frexp exponents, offsets are the zero points.
    fields:
      - [input_zero_point, int32]
      - [output_zero_point, int32]
      - [output_multiplier_fixedpoint_int16, int32]
      - [output_multiplier_exponent, int32]
      - [reluish_multiplier_fixedpoint_int16, int32]
      - [reluish_multiplier_exponent, int32]
  HctHardSwishPreciseParams:
    doc: >-
      CMSIS-NN arm_hard_swish_precise_* (no TFLite counterpart): relu_q3/relu_q6 are round(3|6 / input_scale),
      the output multiplier is input_scale^2 / (6 output_scale) * 2^prescale.
    fields:
      - [input_offset, int32]
      - [output_offset, int32]
      - [output_multiplier, int32]
      - [output_shift, int32]
      - [relu_q3, int32]
      - [relu_q6, int32]
      - [prescale, int32]

  HctTanhLogisticQuant:
    doc: int16 Tanh/Logistic (TFLM prepare); zero points must be 0 and the output scale 2^-15.
    fields:
      - [input_scale, float32]
      - [input_zero_point, int32]
      - [output_scale, float32]
      - [output_zero_point, int32]
  HctTanhLogisticParams:
    doc: >-
      reference_integer_ops::Tanh/Logistic(int16): x * input_multiplier, rounding right shift by
      input_left_shift; input_multiplier 0 means 3 << input_left_shift and no shift.
    fields:
      - [input_multiplier, int32]
      - [input_left_shift, int32]

  HctSoftmaxQuant:
    doc: >-
      TFLM CalculateSoftmaxParams. int8 -> int8 needs output 1/256 at -128, int8 -> int16 1/65536 at -32768,
      int16 -> int16 1/32768 at 0.
    fields:
      - [input_dtype, int32]
      - [output_dtype, int32]
      - [beta, float32]
      - [input_scale, float32]
      - [input_zero_point, int32]
      - [output_scale, float32]
      - [output_zero_point, int32]
  HctSoftmaxParams:
    doc: >-
      SoftmaxParams: int8 rescales x - max by MultiplyByQuantizedMultiplierGreaterThanOne and drops
      differences below diff_min; int16 by MultiplyByQuantizedMultiplier (diff_min unused, 0).
    fields:
      - [input_multiplier, int32]
      - [input_left_shift, int32]
      - [diff_min, int32]

  HctUnaryQuantParams:
    doc: Per-tensor input and output quantization, for entries that work in float on the dequantized value.
    fields:
      - [input_scale, float32]
      - [input_zero_point, int32]
      - [output_scale, float32]
      - [output_zero_point, int32]
  HctQuantizeParams:
    doc: >-
      AffineQuantize / Dequantize at (scale, zero_point); the float side is clamped to
      [activation_min, activation_max] (before quantizing, after dequantizing).
    fields:
      - [scale, float32]
      - [zero_point, int32]
      - [activation_min, float32]
      - [activation_max, float32]
  HctRequantizeParams:
    doc: CMSIS-NN arm_requantize_* - the zero points subtracted and added around arm_nn_requantize.
    fields:
      - [multiplier, int32]
      - [shift, int32]
      - [input_zero_point, int32]
      - [output_zero_point, int32]

  HctFloatActivationTypeParams:
    doc: An HctFloatActivation and its parameter (the LeakyRelu slope; ignored otherwise).
    fields:
      - [activation_type, int32]
      - [act_param, float32]

  HctPerChannelQuantParams:
    doc: >-
      PopulateConvolutionQuantizationParams: each channel's (input_scale * filter_scale[c]) / output_scale,
      formed in double from the float32 scales, through QuantizeMultiplier.
    fields:
      - [input_scale, float32]
      - [output_scale, float32]
  HctConvParams:
    doc: >-
      TFLite ConvParams for the quantized convolutions: input_offset is -input_zero_point, output_offset the
      output zero point (both 0 for int16); groups follow from input depth / filter input depth.
    fields:
      - [stride_h, int32]
      - [stride_w, int32]
      - [dilation_h, int32]
      - [dilation_w, int32]
      - [pad_h, int32]
      - [pad_w, int32]
      - [input_offset, int32]
      - [output_offset, int32]
      - [activation_min, int32]
      - [activation_max, int32]
  HctConvFloatParams:
    fields:
      - [stride_h, int32]
      - [stride_w, int32]
      - [dilation_h, int32]
      - [dilation_w, int32]
      - [pad_h, int32]
      - [pad_w, int32]
      - [activation_min, float32]
      - [activation_max, float32]

  HctFullyConnectedParams:
    doc: >-
      TFLite FullyConnectedParams: input_offset is -input_zero_point, filter_offset -filter_zero_point (0 when
      the filter is symmetric, as per-channel filters are), output_offset the output zero point.
    fields:
      - [input_offset, int32]
      - [filter_offset, int32]
      - [output_offset, int32]
      - [activation_min, int32]
      - [activation_max, int32]

  HctBatchMatMulParams:
    doc: >-
      adj_x / adj_y (0 or 1) mean the stored operand is transposed in its last two dims; offsets are
      -zero_point for the operands, +zero_point for the output; one per-tensor multiplier and shift.
    fields:
      - [adj_x, int32]
      - [adj_y, int32]
      - [lhs_offset, int32]
      - [rhs_offset, int32]
      - [output_offset, int32]
      - [multiplier, int32]
      - [shift, int32]
      - [activation_min, int32]
      - [activation_max, int32]
  HctBatchMatMulFloatParams:
    fields:
      - [adj_x, int32]
      - [adj_y, int32]
      - [activation_min, float32]
      - [activation_max, float32]

  HctPoolParams:
    fields:
      - [stride_h, int32]
      - [stride_w, int32]
      - [filter_h, int32]
      - [filter_w, int32]
      - [pad_h, int32]
      - [pad_w, int32]
      - [activation_min, int32]
      - [activation_max, int32]
  HctPoolFloatParams:
    fields:
      - [stride_h, int32]
      - [stride_w, int32]
      - [filter_h, int32]
      - [filter_w, int32]
      - [pad_h, int32]
      - [pad_w, int32]
      - [activation_min, float32]
      - [activation_max, float32]

  HctAxisMaskParams:
    doc: Bit d set reduces input dim d.
    fields:
      - [axis_mask, int32]
  HctAxisParams:
    fields:
      - [axis, int32]
  HctMeanQuant:
    doc: QuantizedMeanOrSum's requantization for a reduction over `count` elements.
    fields:
      - [input_scale, float32]
      - [output_scale, float32]
      - [count, int64]
  HctMeanParams:
    doc: input_scale / output_scale through QuantizeMultiplier, with 1 / count folded in as TFLM folds it.
    fields:
      - [multiplier, int32]
      - [shift, int32]
  HctMeanQuantizedParams:
    fields:
      - [axis_mask, int32]
      - [input_zero_point, int32]
      - [output_zero_point, int32]
      - [multiplier, int32]
      - [shift, int32]

prepare:
  quantize_multiplier:
    in: HctQuantizeMultiplierIn
    out: HctQuantizeMultiplierOut
  activation_range_quantized:
    in: HctActivationRangeIn
    out: HctActivationRangeOut
  add_prepare:
    in: HctAddQuant
    out: HctAddParams
  sub_prepare:
    in: HctAddQuant
    out: HctAddParams
  mul_prepare:
    in: HctMulQuant
    out: HctMulParams
  squared_difference_prepare:
    in: HctAddQuant
    out: HctSquaredDifferenceParams
  comparison_prepare:
    in: HctComparisonQuant
    out: HctComparisonParams
  abs_prepare:
    in: HctAbsQuant
    out: HctAbsParams
  relu_prepare:
    in: HctReluQuant
    out: HctReluParams
  leaky_relu_prepare:
    in: HctLeakyReluQuant
    out: HctLeakyReluParams
  prelu_prepare:
    in: HctPreluQuant
    out: HctPreluParams
  hard_swish_prepare:
    in: HctHardSwishQuant
    out: HctHardSwishParams
  hard_swish_precise_prepare:
    in: HctHardSwishQuant
    out: HctHardSwishPreciseParams
  tanh_prepare:
    in: HctTanhLogisticQuant
    out: HctTanhLogisticParams
  logistic_prepare:
    in: HctTanhLogisticQuant
    out: HctTanhLogisticParams
  softmax_prepare:
    in: HctSoftmaxQuant
    out: HctSoftmaxParams
  mean_prepare:
    in: HctMeanQuant
    out: HctMeanParams

